name: Publish Documentation

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Serialize the version archive and deployment, including main/tag races.
concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    steps:
      - name: Checkout documentation source and version archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Releasing older reference docs must not roll back the landing page.
      - name: Checkout main landing page for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v4
        with:
          ref: main
          path: .pages-main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies only
        run: |
          python - <<'PY' > /tmp/docs-requirements.txt
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              config = tomllib.load(fh)
          print("\n".join(config["project"]["optional-dependencies"]["docs"]))
          PY
          python -m pip install -r /tmp/docs-requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Test and validate documentation
        run: |
          python -m unittest discover -s tests/docs -v
          python scripts/docs/build_site.py

      - name: Configure version archive author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build dev and latest reference versions
        if: github.ref == 'refs/heads/main'
        run: mike deploy --branch gh-pages --update-aliases dev latest

      - name: Build tagged reference version and stable alias
        if: startsWith(github.ref, 'refs/tags/v')
        run: mike deploy --branch gh-pages --update-aliases "${GITHUB_REF_NAME#v}" stable

      - name: Assemble published site from version archive
        env:
          LANDING_SOURCE: ${{ startsWith(github.ref, 'refs/tags/v') && '.pages-main' || '.' }}
        run: python scripts/docs/build_site.py --versions-branch gh-pages --landing-source "$LANDING_SOURCE"

      - name: Persist validated documentation versions
        run: git push origin gh-pages

      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy landing page and documentation
        id: deployment
        uses: actions/deploy-pages@v4
