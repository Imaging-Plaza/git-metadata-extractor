name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]

jobs:
  v2-ci-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check generated v2 models freshness
        run: just v2-models-check

      - name: Run TTL schema alignment gate
        run: PYTHONPATH=. pytest tests/v2/test_ttl_schema_alignment.py -q

      - name: Run scoped v2 test suite
        run: PYTHONPATH=. pytest tests/v2/
