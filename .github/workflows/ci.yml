name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]
  workflow_dispatch:
    inputs:
      run_llm_integration:
        description: "Run opt-in LLM integration tests"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  # Validate the same landing page + reference layout before publication.
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        # Read the `docs` extra out of pyproject.toml and install *only* that.
        # `pip install ".[docs]"` would also install the project and its full
        # runtime dependency tree — work the site build does not need. Reading
        # the extra keeps pyproject.toml the single source of these versions
        # instead of duplicating them here.
        run: |
          python -m pip install --upgrade pip
          python - <<'PY' > /tmp/docs-requirements.txt
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              config = tomllib.load(fh)
          print("\n".join(config["project"]["optional-dependencies"]["docs"]))
          PY
          cat /tmp/docs-requirements.txt
          python -m pip install -r /tmp/docs-requirements.txt

      - name: Test the Pages assembler
        run: python -m unittest discover -s tests/docs -v

      - name: Build the landing page and reference docs (strict)
        run: python scripts/docs/build_site.py

  v2-ci-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The v3 shapes live in the vendor/open-pulse-ontology submodule.
          # Without it every test that reads them skips, and the job still
          # goes green having checked none of them.
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          # Sources runs as a separate service; install only the extractor.
          python -m pip install -e ".[dev]"

      - name: Prepare the vendored ontology
        # Apply ontology/patches/ (if any) to the pinned submodule. Before any test
        # step: the ontology-backed tests skip only when the files are
        # missing, so against the unpatched TTL they fail instead.
        run: python scripts/v2/prepare_ontology.py

      - name: Check generated v2 models freshness
        run: just v2-models-check

      - name: Check generated ontology models freshness
        # schema/generated/ is committed. Re-render it from the patched TTL
        # and fail on any difference, so the two cannot drift apart unseen.
        run: python scripts/v2/generate_from_ontology.py --check

      - name: Run TTL schema alignment gate
        run: python -m pytest tests/v2/test_ttl_schema_alignment.py -q

      - name: Run JSON-LD roundtrip gate
        run: python -m pytest tests/v2/test_roundtrip.py -q

      - name: Run scoped v2 test suite
        run: python -m pytest tests/v2/ -n 4 --dist=loadfile -m "not live_provider and not llm_integration"

  llm-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_llm_integration == 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          # Sources retrieval uses HTTP; no index library is installed here.
          python -m pip install -e ".[dev]"

      - name: Run LLM integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RCP_TOKEN: ${{ secrets.RCP_TOKEN }}
        run: python -m pytest tests/v2/test_llm_repository_agent.py -m llm_integration -v
