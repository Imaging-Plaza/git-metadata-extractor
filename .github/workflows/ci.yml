name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]
  workflow_dispatch:
    inputs:
      run_llm_integration:
        description: "Run opt-in LLM integration tests"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  # The publish workflow (docs_pages.yml) only runs `mkdocs build --strict` on
  # a push to main or a v* tag — i.e. after merge. A broken nav entry, a dead
  # internal link or an unparseable mkdocs.yml would surface at publish time,
  # on main, instead of on the PR that caused it. Same build, run as a gate.
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        # Read the `docs` extra out of pyproject.toml and install *only* that.
        # `pip install ".[docs]"` would also install the project and its full
        # runtime dependency tree (including the open-pulse-sources git
        # dependency) — minutes of work the site build does not need. Reading
        # the extra keeps pyproject.toml the single source of these versions
        # instead of duplicating them here.
        run: |
          python -m pip install --upgrade pip
          python - <<'PY' > /tmp/docs-requirements.txt
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              config = tomllib.load(fh)
          print("\n".join(config["project"]["optional-dependencies"]["docs"]))
          PY
          cat /tmp/docs-requirements.txt
          python -m pip install -r /tmp/docs-requirements.txt

      - name: Build the docs site (strict)
        # --strict promotes warnings to errors, which covers unresolvable
        # internal links and pages missing from the nav without an explicit
        # `not_in_nav` entry.
        run: mkdocs build --strict

  v2-ci-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          # The RAG index layer (open-pulse-sources) is a declared dependency
          # pinned to an immutable tag in pyproject.toml — installed here as
          # part of the project, with no second pin to keep in sync.
          python -m pip install -e ".[dev]"

      - name: Check generated v2 models freshness
        run: just v2-models-check

      - name: Run TTL schema alignment gate
        run: python -m pytest tests/v2/test_ttl_schema_alignment.py -q

      - name: Run JSON-LD roundtrip gate
        run: python -m pytest tests/v2/test_roundtrip.py -q

      - name: Run scoped v2 test suite
        run: python -m pytest tests/v2/ -n 4 --dist=loadfile -m "not live_provider and not llm_integration"

  llm-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_llm_integration == 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          # open-pulse-sources comes in via the pyproject pin (see above job).
          python -m pip install -e ".[dev]"

      - name: Run LLM integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RCP_TOKEN: ${{ secrets.RCP_TOKEN }}
        run: python -m pytest tests/v2/test_llm_repository_agent.py -m llm_integration -v
