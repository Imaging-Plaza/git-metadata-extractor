# SNSF P3 (Swiss National Science Foundation) RAG indexer config.
# Resolved by `open_pulse_sources/index/snsf/config.py`.
#
# Core ingest settings; embedding and Qdrant settings use the library's
# model defaults and supported environment overrides.
# The default loader resolves this file relative to the installed sources
# library, not the extractor checkout. See ../README.md before editing.

snsf:
  base_url: https://data.snf.ch
  request_timeout_s: 60
  page_size: 1000
  inter_request_sleep_s: 0.2
  user_agent: >-
    git-metadata-extractor/snsf (polite scraper; please email if issues)

scope:
  # Active scope. Drives which subset is materialised into `scope_records`
  # at `load-local` time. Override on the CLI with `--scope`.
  active: epfl
  # Filter clause = (Solr field name → list of UUIDs/IDs). Sources owns the
  # API and CSV ingest implementations and their equivalent scope filters.
  filters:
    epfl:
      research_institution_id: ["a8095007-f9b3-4170-ab92-59fbecfbba10"]
    ethz:
      research_institution_id: ["3501eb73-70f2-4abd-b626-2c764d7f73dd"]
    eth_domain:
      research_institution_type_id: ["6ee0a15d-934b-416f-bfb6-0f0b5638edb3"]
    switzerland: {}
