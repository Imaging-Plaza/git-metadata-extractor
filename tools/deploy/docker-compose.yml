# Production-oriented deployment stack for git-metadata-extractor.
#
#   docker compose -f tools/deploy/docker-compose.yml --env-file .env up -d
#
# Services:
#   gme-api          extraction API on :1234; HTTP client of sources
#   gme-sources      owns retrieval, ingest, embedding and index storage;
#                    built from the independent dev/open-pulse-sources checkout
#   gme-gimie-api    REQUIRED sidecar — the `gimie` Python dep was removed, so
#                    repository extraction calls this over HTTP. See
#                    docs/OPERATIONS_RUNBOOK.md §8.
#   gme-qdrant       vector store for the RAG indices
#   gme-oxigraph     RDF quad store holding the substrate: one named graph per
#                    `pulse:ExtractionOutput`, accumulated across runs. Optional
#                    — gme-api writes to it only when V2_SUBSTRATE_ENABLED is
#                    on, and the write fails open, so dropping the service
#                    costs warnings rather than extractions.
#   gme-selenium     headless Firefox for link-veracity + Selenium-backed RAG
#                    ingest (SWISSUbase, ORCID scraping). Optional — drop it and
#                    unset SELENIUM_REMOTE_URL if you don't need those.
#
# Secrets/config come from `.env` (see .env.example): API_TOKEN,
# GME_GITHUB_TOKEN, RCP_TOKEN (or an LLM key), etc. The inter-service URLs below
# are set explicitly so they don't need to live in .env.
services:
  gme-api:
    image: ${GME_IMAGE:-git-metadata-extractor:local}
    build:
      context: ../..
      dockerfile: tools/image/Dockerfile
    container_name: gme-api
    env_file:
      - ../../.env
    environment:
      # GIMIE is served by the sidecar (gimie is no longer in the image).
      GIMIE_API_URL: http://gme-gimie-api:15400
      SOURCES_API_URL: http://gme-sources:8080
      SOURCES_API_TOKEN: ${SOURCES_API_TOKEN:-${API_TOKEN:-}}
      V2_PROVIDER_CACHE_PATH: /app/data/cache/providers.db
      SELENIUM_REMOTE_URL: http://gme-selenium:4444
      # The substrate writer's target. Set on the service rather than in .env
      # like the other inter-service URLs; the writer stays off until
      # V2_SUBSTRATE_ENABLED is also true, so this is inert by default.
      V2_SUBSTRATE_STORE_URL: http://gme-oxigraph:7878
      WORKERS: ${WORKERS:-2}
    ports:
      - "${APP_PORT:-1234}:1234"
    volumes:
      # Only extractor cache/output data; no shared index filesystem.
      - gme-api-data:/app/data
    # gme-oxigraph is deliberately absent, like gme-selenium: both are
    # optional services, and a depends_on entry would make the API refuse to
    # start for anyone who drops one.
    depends_on:
      - gme-gimie-api
      - gme-sources
    restart: unless-stopped
    networks:
      - gme

  gme-sources:
    # The new /v2/retrieval and /v2/extractor operations require this local
    # branch; the published 0.1.2 image does not implement that contract.
    image: ${SOURCES_IMAGE:-open-pulse-sources:local}
    build:
      context: ../../dev/open-pulse-sources
      dockerfile: tools/image/Dockerfile
    container_name: gme-sources
    env_file:
      - ../../.env
    environment:
      API_TOKEN: ${SOURCES_API_TOKEN:-${API_TOKEN:-}}
      INDEX_QDRANT_URL: http://gme-qdrant:6333
      # Only sources opens the index files.
      INDEX_DATA_DIR: /app/data/index
      SELENIUM_REMOTE_URL: http://gme-selenium:4444
      # DuckDB and job coordination require a single sources writer process.
      WORKERS: "1"
    ports:
      - "${SOURCES_PORT:-8080}:8080"
    volumes:
      # Keep the existing sources volume; never reset indices during migration.
      - gme-data:/app/data
    depends_on:
      - gme-qdrant
    restart: unless-stopped
    networks:
      - gme

  gme-gimie-api:
    # GME-maintained sidecar image (tools/gimie-api) — the upstream
    # ghcr.io/sdsc-ordes/gimie-api images (pinned digest AND :latest) ship
    # gimie 0.6.1 with an app written for the 0.7.x API: every extraction
    # request fails and the error contract collapses to an empty payload.
    # See dev/split-rag-indices/11-gimie-sidecar-jsonld-broken.md.
    build:
      context: ../gimie-api
    image: ${GIMIE_API_IMAGE:-gme-gimie-api:0.7.2}
    container_name: gme-gimie-api
    environment:
      # The gimie LIBRARY inside the sidecar reads GITHUB_TOKEN (the app's
      # ACCESS_TOKEN is consumed by nothing but a debug print — kept for
      # forward-compat). Must be a SINGLE PAT: GME_GITHUB_TOKEN may be a
      # comma-separated pool (the extractor round-robins it), which gimie
      # cannot parse — set GIMIE_ACCESS_TOKEN to one PAT in that case.
      GITHUB_TOKEN: ${GIMIE_ACCESS_TOKEN:-${GME_GITHUB_TOKEN:-}}
      ACCESS_TOKEN: ${GIMIE_ACCESS_TOKEN:-${GME_GITHUB_TOKEN:-}}
    restart: unless-stopped
    networks:
      - gme

  gme-qdrant:
    image: qdrant/qdrant:latest
    container_name: gme-qdrant
    volumes:
      - gme-qdrant-storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - gme

  gme-oxigraph:
    # The substrate store. Pinned rather than :latest, unlike gme-qdrant: this
    # holds accumulated provenance that a storage-format change would strand,
    # and the unifier (phase 4) will depend on RDF-star support that only
    # exists from 0.4 onwards.
    image: ghcr.io/oxigraph/oxigraph:0.4.11
    container_name: gme-oxigraph
    # `serve` binds 127.0.0.1 by default, which is unreachable from another
    # container even on the same network.
    command: serve --location /data --bind 0.0.0.0:7878
    volumes:
      - gme-oxigraph-storage:/data
    # Deliberately not published to the host. The store is writable without
    # authentication — Oxigraph ships none — so it must stay on the internal
    # network. Expose it through a reverse proxy that adds auth if you need
    # external SPARQL access.
    restart: unless-stopped
    networks:
      - gme

  gme-selenium:
    image: selenium/standalone-firefox
    container_name: gme-selenium
    shm_size: "2g"
    environment:
      SE_NODE_MAX_SESSIONS: "5"
      SE_NODE_SESSION_TIMEOUT: "300"
    restart: unless-stopped
    networks:
      - gme

volumes:
  gme-api-data:
  gme-data:
  gme-qdrant-storage:
  gme-oxigraph-storage:

networks:
  gme:
