site_name: Git Metadata Extractor Documentation
site_url: https://imaging-plaza.github.io/git-metadata-extractor/
repo_url: https://github.com/Imaging-Plaza/git-metadata-extractor
repo_name: Imaging-Plaza/git-metadata-extractor
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections

plugins:
  - search

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Understand the system:
      - Architecture Overview: architecture/overview.md
      - V2 Extract Pipeline: v2-pipeline.md
      - Cross-Repo Contract: cross-repo-contract.md
      - Design Notes: architecture/design-notes.md
  - Use the API:
      - V2 API Reference: v2-api-reference.md
      - API and CLI Quick Reference: api-and-cli.md
      - Repository Enrichment Fields: repository-enrichment-fields.md
      - Migration V1 to V2: migration-v1-to-v2.md
  - Operate it:
      - Operations Runbook: OPERATIONS_RUNBOOK.md
  # Index build/refresh docs live in the open-pulse-sources repo:
  # https://github.com/sdsc-ordes/open-pulse-sources — only the read-side
  # (RAG tools the extraction pipeline consumes) is documented here.
  - RAG (read side):
      - V2 Agent RAG Tools: v2-rag-tools.md
      - Concept Tagging Stage: concept-tagging.md
  - Ontology:
      - v3.0.0 Reference (proposed): releases/ontology-v3.0.0.md
      - JSON Schema Graphs: releases/json-schemas.md
  - Project:
      - Roadmap: ROADMAP.md
  # Historical working notes. Kept for provenance, deliberately one nav entry:
  # the individual pages are linked from archive/index.md and are listed in
  # not_in_nav below so `mkdocs build --strict` stays quiet about them.
  - Archive: archive/index.md

# Pages reachable by link but intentionally absent from the nav tree.
not_in_nav: |
  archive/AGENT_STRATEGY.md
  archive/INFOSCIENCE_INTEGRATION.md
  archive/INFOSCIENCE_API_FINDINGS.md
  archive/JSONLD_CONVERSION.md
  archive/PYDANTIC_JSONLD_MAPPING.md
  archive/JSONLD_CONVERSION_SUMMARY.md
  archive/JSONLD_MAPPING_UPDATE.md
  archive/JSON_JSONLD_CONVERSION_CLI.md
  archive/ACADEMIC_CATALOG_OPTION_B_IMPLEMENTATION.md
  archive/ACADEMIC_CATALOG_REFACTOR_SUMMARY.md
  archive/AFFILIATION_CHANGES.md
  archive/ESTIMATED_TOKENS_FIX.md
  archive/UPDATES_SUMMARY.md
  archive/issue-brief-gimie-github-cff-edge-cases.md
  releases/legacy-releases.md
