  }));
  f.querySelector("[data-labels]").addEventListener("click", e => {
    nstate.allLabels = !nstate.allLabels;
    e.currentTarget.setAttribute("aria-pressed", nstate.allLabels); buildNet();
  });
  f.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
    nstate.mode = b.dataset.mode;
    f.querySelectorAll("[data-mode]").forEach(x =>
      x.setAttribute("aria-pressed", x.dataset.mode === nstate.mode));
    buildNet();
  }));
  f.querySelector("[data-opts]").addEventListener("click", e => {
    opts.hidden = !opts.hidden;
    e.currentTarget.setAttribute("aria-pressed", !opts.hidden);
    e.currentTarget.textContent = opts.hidden ? "options ▾" : "options ▴";
  });
  let pending = 0;
  opts.querySelectorAll("[data-opt]").forEach(r => r.addEventListener("input", () => {
    nstate[r.dataset.opt] = +r.value;
    $(`[data-out="${r.dataset.opt}"]`, opts).textContent = r.value;
    // one rebuild per frame, so dragging a slider stays smooth
    if (pending) return;
    pending = requestAnimationFrame(() => { pending = 0; buildNet(); });
  }));
  f.querySelector("[data-reset]").addEventListener("click", () => {
    nstate.sel = null; view.k = 1; view.x = 0; view.y = 0; buildNet();
  });
  buildNet();
}

const LAYER_OF = {property: "structure", shape: "structure", subclass: "structure",
  observed: "observed", alignment: "alignment", vocabAlignment: "alignment"};
const view = {k: 1, x: 0, y: 0};
let netRoot = null;   // the <g> every rebuild replaces; pan/zoom transforms it
const applyView = () => netRoot && netRoot.setAttribute("transform",
  `translate(${view.x},${view.y}) scale(${view.k})`);
const SVGNS = "http://www.w3.org/2000/svg";
const mk = (t, attrs) => { const n = document.createElementNS(SVGNS, t);
  for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };

function buildNet() {
  const svg = $("#net");
  if (!svg) return;
  const W = svg.clientWidth || 900, H = svg.clientHeight || 600;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";

  const links = DATA.network.links.filter(l => nstate.layers[LAYER_OF[l.kind]]);
  const keep = new Set();
  links.forEach(l => { keep.add(l.source); keep.add(l.target); });
  let nodes = DATA.network.nodes.filter(n => keep.has(n.id) || n.instances > 0);
  const byId = {};
  // deterministic seed layout: a circle, so every render is identical
  nodes = nodes.map((n, i) => {
    // seeded on an ellipse matching the canvas aspect, not a circle: a circular
    // seed in a 2:1 frame settles into a blob that wastes half the width
    const a = i / nodes.length * Math.PI * 2;
    const o = byId[n.id] = Object.assign({}, n, {
      x: W / 2 + Math.cos(a) * W * .34, y: H / 2 + Math.sin(a) * H * .34, vx: 0, vy: 0,
      r: Math.max(5, (7 + Math.sqrt(n.degree || 1) * 3.4) * nstate.nodeScale)
    });
    return o;
  });
  const ls = links.filter(l => byId[l.source] && byId[l.target])
    .map(l => Object.assign({}, l, {s: byId[l.source], t: byId[l.target]}));

  // ---- force layout, settled before the first paint (43 nodes: cheap).
  // Degree also sets how hard a node pushes: hubs need room for their labels,
  // leaves do not. Positions are unclamped here — fitting happens afterwards,
  // so the layout is never squeezed into the viewport it was seeded in.
  const pairIndex = {};
  ls.forEach(l => { const k = [l.source, l.target].sort().join("|");
    l.curve = (pairIndex[k] = (pairIndex[k] || 0) + 1) - 1; });
  const STEPS = 600;
  for (let step = 0; step < STEPS; step++) {
    const alpha = Math.pow(1 - step / STEPS, 1.4);
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = (i - j) || 1; dy = (j - i) * .7 || .7; d2 = dx * dx + dy * dy; }
        const d = Math.sqrt(d2);
        const f = Math.min(60, (14000 + a.r * b.r * 90) / d2 * nstate.repulsion) * (.35 + alpha);
        const ux = dx / d, uy = dy / d;
        a.vx -= ux * f; a.vy -= uy * f; b.vx += ux * f; b.vy += uy * f;
        const minD = a.r + b.r + 26;
        if (d < minD) { const push = (minD - d) * .45;
          a.vx -= ux * push; a.vy -= uy * push; b.vx += ux * push; b.vy += uy * push; }
      }
    }
    ls.forEach(l => {
      const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const target = nstate.spacing * (l.kind === "vocabAlignment" ? 1.4 : 1);
      const f = (d - target) * .06 * (.4 + alpha), ux = dx / d, uy = dy / d;
      l.s.vx += ux * f; l.s.vy += uy * f; l.t.vx -= ux * f; l.t.vy -= uy * f;
    });
    // centering is stronger on the short axis, which flattens the blob into the
    // frame's aspect instead of fighting it
    const ar = W / H;
    nodes.forEach(n => {
      n.vx += (W / 2 - n.x) * .0016 / ar; n.vy += (H / 2 - n.y) * .0016 * ar;
      n.x += (n.vx *= .86); n.y += (n.vy *= .86);
    });
  }

  // ---- fit the settled layout to the canvas, so the graph fills the frame
  // whatever the forces produced and whatever size the container is.
  if (nodes.length) {
    const pad = 46;
    const x0 = Math.min(...nodes.map(n => n.x - n.r)), x1 = Math.max(...nodes.map(n => n.x + n.r));
    const y0 = Math.min(...nodes.map(n => n.y - n.r)), y1 = Math.max(...nodes.map(n => n.y + n.r));
    const sx = (W - pad * 2) / Math.max(1, x1 - x0);
    const sy = (H - pad * 2) / Math.max(1, y1 - y0);
    const s = Math.min(sx, sy, 1.6);
    // a little extra stretch on the roomier axis — capped, so edge lengths stay
    // broadly comparable and the picture is not a funhouse mirror
    const kx = Math.min(1.4, Math.max(1, sx / s)), ky = Math.min(1.4, Math.max(1, sy / s));
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    nodes.forEach(n => {
      n.x = W / 2 + (n.x - cx) * s * kx;
      n.y = H / 2 + (n.y - cy) * s * ky;
      n.r = Math.max(5, n.r * Math.min(1, s * 1.15));
    });
  }

  // ---- board mode: snap every pad to the grid, and never onto an occupied
  // cell. Traces are only legible if their endpoints sit on the same lattice
  // they run along.
  const G = Math.max(8, nstate.grid);
  if (nstate.mode === "pcb") {
    const taken = new Set();
    const key = (gx, gy) => gx + "," + gy;
    nodes.slice().sort((a, b) => b.degree - a.degree).forEach(n => {
      let gx = Math.round(n.x / G), gy = Math.round(n.y / G);
      const need = Math.max(1, Math.ceil((n.r + 6) / G));   // pads reserve a halo
      const free = (x, y) => {
        for (let i = -need; i <= need; i++)
          for (let j = -need; j <= need; j++) if (taken.has(key(x + i, y + j))) return false;
        return true;
      };
      if (!free(gx, gy)) {                     // spiral out to the nearest free cell
        outer: for (let ring = 1; ring < 40; ring++)
          for (let i = -ring; i <= ring; i++)
            for (let j = -ring; j <= ring; j++) {
              if (Math.max(Math.abs(i), Math.abs(j)) !== ring) continue;
              if (free(gx + i, gy + j)) { gx += i; gy += j; break outer; }
            }
      }
      for (let i = -need; i <= need; i++)
        for (let j = -need; j <= need; j++) taken.add(key(gx + i, gy + j));
      n.x = gx * G; n.y = gy * G;
    });
  }

  if (nstate.mode === "pcb") {
    const defs = mk("defs", {});
    const pat = mk("pattern", {id: "boardGrid", width: G, height: G,
      patternUnits: "userSpaceOnUse"});
    pat.appendChild(mk("circle", {cx: .9, cy: .9, r: .9, fill: "var(--axis)",
      "fill-opacity": .7}));
    defs.appendChild(pat);
    svg.appendChild(defs);
    svg.appendChild(mk("rect", {x: -2000, y: -2000, width: 6000, height: 6000,
      fill: "url(#boardGrid)"}));
  }
  const root = mk("g", {});
  svg.appendChild(root);
  const gEdge = mk("g", {}), gNode = mk("g", {}), gLabel = mk("g", {});
  root.append(gEdge, gNode, gLabel);
  netRoot = root;
  applyView();

  // label the hubs by default — 43 labels at once is a wall of text. The rest
  // come in on hover, on selection, or with the "all labels" toggle.
  const degrees = nodes.map(n => n.degree).sort((a, b) => b - a);
  const labelCut = nstate.labelTop <= 0 ? Infinity
    : (degrees[Math.min(nstate.labelTop - 1, degrees.length - 1)] || 1);

  const neigh = new Set();
  if (nstate.sel) { neigh.add(nstate.sel);
    ls.forEach(l => { if (l.source === nstate.sel) neigh.add(l.target);
      if (l.target === nstate.sel) neigh.add(l.source); }); }
  const lit = id => !nstate.sel || neigh.has(id);

  // Board traces: leave the pad on an axis, turn once at 45°, arrive on an axis
  // — the way a router actually draws copper. Parallel traces between the same
  // pair are lane-offset so they read as separate nets.
  function tracePath(l) {
    const lane = ((l.curve % 2 ? 1 : -1) * Math.ceil(l.curve / 2)) * Math.max(4, G * .34);
    const sx = l.s.x, sy = l.s.y, tx = l.t.x + lane, ty = l.t.y + lane;
    const dx = tx - sx, dy = ty - sy;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    const diag = Math.min(ax, ay);
    const sgx = Math.sign(dx) || 1, sgy = Math.sign(dy) || 1;
    // run along the long axis first, then cut the corner at 45°
    return ax >= ay
      ? `M${sx},${sy} H${(sx + sgx * (ax - diag)).toFixed(1)} L${tx.toFixed(1)},${ty.toFixed(1)}`
      : `M${sx},${sy} V${(sy + sgy * (ay - diag)).toFixed(1)} L${tx.toFixed(1)},${ty.toFixed(1)}`;
  }
  function curvePath(l) {
    const mx = (l.s.x + l.t.x) / 2, my = (l.s.y + l.t.y) / 2;
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
    const off = (l.curve % 2 ? 1 : -1) * Math.ceil(l.curve / 2) * 26;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    return `M${l.s.x.toFixed(1)},${l.s.y.toFixed(1)} Q${
      (mx - dy / d * off).toFixed(1)},${(my + dx / d * off).toFixed(1)} ${
      l.t.x.toFixed(1)},${l.t.y.toFixed(1)}`;
  }

  const paths = ls.map(l => {
    const e = EDGE[l.kind];
    const on = lit(l.source) && lit(l.target);
    const pcb = nstate.mode === "pcb";
    const d = pcb ? tracePath(l) : curvePath(l);
    // a surface-coloured halo under each lit trace, so a crossing reads as one
    // trace passing over the other instead of a merged blob
    if (on) gEdge.appendChild(mk("path", {d, fill: "none", stroke: "var(--surface)",
      "stroke-width": e.w + 2.4, "stroke-opacity": .9, "stroke-linejoin": "round"}));
    const p = mk("path", {
      class: "edge" + (l.kind === "observed" ? " observed" : ""), d,
      "stroke-width": e.w, "stroke-opacity": on ? e.op : .06,
      "stroke-dasharray": e.dash || "none",
      "stroke-linecap": pcb ? "butt" : "round",
      "stroke-linejoin": "round"
    });
    p.style.pointerEvents = "stroke";
    p.addEventListener("pointermove", ev => showTip(ev,
      `<div class="t-h">${esc(l.source)} → ${esc(l.target.replace("vocab:", ""))}</div>
       <div class="t-d">${esc(l.via)} · ${esc(EDGE[l.kind].label)}${
        l.count ? ` · ${l.count} triple${l.count > 1 ? "s" : ""}` : ""}</div>`));
    p.addEventListener("pointerleave", hideTip);
    gEdge.appendChild(p);
    return p;
  });

  nodes.forEach(n => {
    const o = ORIGIN[n.origin] || ORIGIN.external;
    const on = lit(n.id);
    const pcb = nstate.mode === "pcb";
    const g = mk("g", {class: "node-hit", opacity: on ? 1 : .18});
    let shape;
    if (n.kind === "vocab") {
      shape = mk("rect", {x: -n.r * .82, y: -n.r * .82, width: n.r * 1.64,
        height: n.r * 1.64, transform: "rotate(45)", rx: pcb ? 1 : 2});
    } else if (pcb) {
      // a pad, not a bubble: square-ish copper with a rounded corner
      shape = mk("rect", {x: -n.r, y: -n.r, width: n.r * 2, height: n.r * 2,
        rx: Math.min(3, n.r * .35)});
    } else if (o.shape === "square") {
      shape = mk("rect", {x: -n.r * .86, y: -n.r * .86, width: n.r * 1.72,
        height: n.r * 1.72, rx: 3});
    } else {
      shape = mk("circle", {r: n.r});
    }
    shape.setAttribute("fill", o.color);
    shape.setAttribute("stroke", "var(--surface)");
    shape.setAttribute("stroke-width", 1.5);
    g.setAttribute("transform", `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
    g.appendChild(shape);
    // the drill hole — only when the pad is big enough to show one
    if (pcb && n.r >= 7) g.appendChild(mk("circle", {r: n.r * .3,
      fill: "var(--surface)", "fill-opacity": .95}));
    if (o.ring) g.appendChild(mk(pcb ? "rect" : "circle", pcb
      ? {x: -n.r - 3, y: -n.r - 3, width: (n.r + 3) * 2, height: (n.r + 3) * 2,
         rx: 2, fill: "none", stroke: o.color, "stroke-width": 1.3, "stroke-opacity": .9}
      : {r: n.r + 3.5, fill: "none", stroke: o.color, "stroke-width": 1.5,
         "stroke-opacity": .9}));
    if (n.instances && n.r >= 7) {
      const b = mk("circle", {r: 5.5, cx: n.r * .95, cy: -n.r * .95, fill: "var(--surface)",
        stroke: "var(--ink-muted)", "stroke-width": 1});
      g.appendChild(b);
      const tx = mk("text", {x: n.r * .95, y: -n.r * .95 + 2.6, "text-anchor": "middle",
        "font-size": 7.5, fill: "var(--ink-2)"});
      tx.textContent = n.instances; g.appendChild(tx);
    }
    g.addEventListener("pointermove", ev => showTip(ev,
      `<div class="t-h">${esc(n.label)} <span class="muted mono">${esc(n.id)}</span></div>
       <div class="t-d">${esc((ORIGIN[n.origin] || {}).label || n.origin)} ·
       ${n.degree} connection${n.degree === 1 ? "" : "s"}${
        n.instances ? ` · ${n.instances} instance${n.instances > 1 ? "s" : ""}` : ""}${
        n.platforms && n.platforms.length ? `<br>${esc(n.platforms.join(", "))}` : ""}</div>`));
    g.addEventListener("pointerleave", hideTip);
    g.addEventListener("click", ev => { ev.stopPropagation();
      nstate.sel = nstate.sel === n.id ? null : n.id; buildNet(); });
    gNode.appendChild(g);

    if (nstate.allLabels || n.degree >= labelCut || n.kind === "vocab" ||
        nstate.sel === n.id || (nstate.sel && neigh.has(n.id))) {
      const label = mk("text", {class: "node-label", x: n.x, y: n.y - n.r - 5,
        "text-anchor": "middle", opacity: on ? 1 : .2});
      label.textContent = n.id.replace("vocab:", "").replace(/^\w+:/, "");
      gLabel.appendChild(label);
    }
  });

  // side panel for the selected node
  const side = $("#netSide");
  if (nstate.sel) {
    const n = byId[nstate.sel], t = T[nstate.sel] || {};
    const rel = ls.filter(l => l.source === nstate.sel || l.target === nstate.sel);
    side.hidden = false;
    side.innerHTML = `<button class="close" aria-label="Close">×</button>
      <h4>${esc(n.label)}</h4>
      <div class="mono muted" style="font-size:11px">${esc(n.id)}</div>
      <div style="margin:7px 0">${originPill(n.origin)}${
        n.instances ? `<span class="pill">${n.instances} instance${n.instances > 1 ? "s" : ""}</span>` : ""}</div>
      ${t.definition ? `<p class="t-d" style="margin:6px 0">${esc(t.definition.slice(0, 200))}${
        t.definition.length > 200 ? "…" : ""}</p>` : ""}
      <ul>${rel.map(l => { const other = l.source === nstate.sel ? l.target : l.source;
        const dir = l.source === nstate.sel ? "→" : "←";
        return `<li>${dir} <b>${esc(other.replace("vocab:", ""))}</b>
          <span class="muted mono" style="font-size:10.5px">${esc(l.via)}</span></li>`; }).join("")}</ul>
      ${T[nstate.sel] ? `<button class="chip" data-go="${esc(nstate.sel)}"
        style="margin-top:9px">open the full term →</button>` : ""}`;
    side.querySelector(".close").addEventListener("click", () => { nstate.sel = null; buildNet(); });
  } else { side.hidden = true; side.innerHTML = ""; }

  // ---- pan / zoom / drag. Bound once: buildNet() re-runs on every click and
  // re-registering here would stack a handler per rebuild.
  if (svg.dataset.bound) return;
  svg.dataset.bound = "1";
  let drag = null;
  svg.addEventListener("pointerdown", e => {
    drag = {x: e.clientX, y: e.clientY, vx: view.x, vy: view.y};
    svg.classList.add("dragging");
  });
  svg.addEventListener("pointermove", e => {
    if (!drag) return;
    view.x = drag.vx + (e.clientX - drag.x); view.y = drag.vy + (e.clientY - drag.y);
    applyView();
  });
  const end = () => { drag = null; svg.classList.remove("dragging"); };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointerleave", end);
  svg.addEventListener("click", e => { if (e.target === svg && nstate.sel) {
    nstate.sel = null; buildNet(); } });
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const k = Math.max(.4, Math.min(3.2, view.k * (e.deltaY < 0 ? 1.12 : .89)));
    const r = svg.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    view.x = mx - (mx - view.x) * (k / view.k);
    view.y = my - (my - view.y) * (k / view.k);
    view.k = k; applyView();
  }, {passive: false});
}
function netFocus(id) {
  nstate.sel = DATA.network.nodes.some(n => n.id === id) ? id : null;
  buildNet();
  if (!nstate.sel) alert(id + " has no class-level connections, so it is not a network node.");
}

/* -------------------------------------------------------------- shapes */
function renderShapes() {
  const v = $("#v-shapes");
  const open = DATA.shapes.filter(s => s.closed === "false").length;
  v.innerHTML = `<h1>SHACL shapes</h1>
    <p class="lede">${DATA.shapes.length} node shapes,
      ${DATA.shapes.reduce((n, s) => n + s.properties.length, 0)} property constraints.
      <b>${open}</b> are open (<code>sh:closed false</code>) — that is ask #13, and it alone
      clears 45 of the 52 violations the published shapes raise on real data.</p>`;
  DATA.shapes.forEach(s => {
    const c = el("div", "card");
    c.style.marginBottom = "14px";
    c.innerHTML = `<div class="detail-head" style="margin-bottom:8px">
        <h2 style="margin:0">${esc(s.name)}</h2>
        <span class="pill">sh:closed ${esc(s.closed || "—")}</span>
        ${s.targetClass ? `<button class="chip" data-go="${esc(s.targetClass)}">${
          esc(s.targetClass)}</button>` : "<span class='pill'>no target class</span>"}
        <span class="pill">${s.properties.length} constraints</span></div>`;
    const sc = el("div", "scrollx");
    sc.innerHTML = `<table><thead><tr><th>path</th><th>name</th><th>class / datatype</th>
      <th>card.</th><th>node kind</th><th>pattern</th></tr></thead><tbody>${
      s.properties.map(p => `<tr>
        <td class="nowrap">${T[p.path] ? `<button class="tag link" data-go="${esc(p.path)}">${
          esc(p.path)}</button>` : `<span class="mono">${esc(p.path)}</span>`}</td>
        <td>${esc(p.name)}</td><td>${esc(p.class || p.datatype || "—")}</td>
        <td class="nowrap muted">${esc(`${p.minCount || 0}..${p.maxCount || "*"}`)}</td>
        <td class="muted">${esc(p.nodeKind.replace("sh:", "") || "—")}</td>
        <td class="mono muted" style="font-size:11px">${esc(p.pattern.slice(0, 46))}</td></tr>`).join("")}
      </tbody></table>`;
    c.appendChild(sc); v.appendChild(c);
  });
}

/* ----------------------------------------------------------- alignment */
function renderAlign() {
  const v = $("#v-align");
  const byVocab = {};
  DATA.alignments.forEach(a => (byVocab[a.vocab] = byVocab[a.vocab] || []).push(a));
  v.innerHTML = `<h1>External alignment</h1>
    <p class="lede">${DATA.alignments.length} axioms saying our term <i>is a kind of</i>
      someone else's, plus ${DATA.typings.length} places where a domain or range reuses an
      external class. Every target IRI below was fetched and checked against the published
      vocabulary — see <code>verification.md</code>. Kept apart on purpose: reusing a class
      as a range is not the same claim as declaring a subproperty.</p>`;
  const c = el("div", "card");
  c.innerHTML = "<h3 style='margin-top:0'>Axioms per vocabulary</h3>";
  c.appendChild(barChart(Object.entries(byVocab).sort((a, b) => b[1].length - a[1].length)
    .map(([k, arr]) => ({k, v: arr.length, note: arr.map(a => a.term).join(", ").slice(0, 160)})),
    {unit: "axioms"}));
  v.appendChild(c);

  const sc = el("div", "scrollx");
  sc.style.marginTop = "18px";
  const rowsOf = (arr, tag) => arr.map(a => `<tr>
      <td class="nowrap">${T[a.term] ? `<button class="tag link" data-go="${esc(a.term)}">${
        esc(a.term)}</button>` : `<span class="mono">${esc(a.term)}</span>`}</td>
      <td class="mono muted nowrap">${esc(a.axiom)}</td>
      <td class="mono nowrap">${esc(a.target)}</td>
      <td>${esc(a.vocab)}</td>
      <td class="muted nowrap">${tag}</td></tr>`).join("");
  sc.innerHTML = `<table><thead><tr><th>our term</th><th>axiom</th><th>their term</th>
    <th>vocabulary</th><th>kind of claim</th></tr></thead><tbody>${
    rowsOf(DATA.alignments, "alignment") + rowsOf(DATA.typings, "reuse as domain/range")
  }</tbody></table>`;
  v.appendChild(sc);
}

/* --------------------------------------------------------- enumerations */
function renderEnums() {
  const v = $("#v-enums");
  const newN = members.filter(m => m.origin === "proposed").length;
  v.innerHTML = `<h1>Enumerations</h1>
    <p class="lede">${enumClasses.length} enumerations, ${members.length} members,
      of which <b>${newN}</b> are ours to add. These are the cheapest asks in the proposal:
      no new class, no shape edit. Six of them are the reason the conversion test failed —
      <code>ROR</code>, <code>OpenAlex</code>, <code>CORDIS</code>, <code>SNSF_P3</code>,
      <code>DepsDev</code> and <code>DockerHub</code> are platforms we read in production
      but cannot name.</p>`;
  const grid = el("div");
  grid.style.cssText = "display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr))";
  Object.entries(DATA.enums).forEach(([cls, ms]) => {
    const mine = ms.filter(m => T[m] && T[m].origin === "proposed");
    const c = el("div", "card");
    c.innerHTML = `<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">
        <b style="font-size:13.5px">${esc(cls.split(":")[1].replace("Enumeration", ""))}</b>
        <span class="pill">${ms.length} members</span>
        ${mine.length ? `<span class="pill">${originDot("proposed")}${mine.length} new</span>` : ""}
      </div>
      <div class="tags" style="margin-top:9px">${ms.map(m => {
        const isNew = T[m] && T[m].origin === "proposed";
        return `<button class="tag link" data-go="${esc(m)}"${isNew ?
          ' style="border-color:var(--c-proposed);color:var(--ink)"' : ""}>${
          esc(m.split(":")[1])}</button>`; }).join("")}</div>`;
    grid.appendChild(c);
  });
  v.appendChild(grid);
}

/* ----------------------------------------------------------- sources */
function renderSources() {
  const v = $("#v-sources");
  const kinds = {};
  DATA.sources.forEach(s => kinds[s.kind] = (kinds[s.kind] || 0) + 1);
  const withUrl = DATA.sources.filter(s => s.url).length;
  v.innerHTML = `<h1>Where every value came from</h1>
    <p class="lede">${DATA.sources.length} payloads behind the
      ${M.triplesInstance}-triple instance graph. ${withUrl} carry the exact request
      URL and the moment it was captured; the rest are dated bulk files or local
      indices, and say so. Nothing in this table is asserted by hand — it is read
      from the fixture manifest, the capture sidecars, and the graph's own
      <code>pulse:retrievedFrom</code> values.</p>`;

  const tiles = el("div", "tiles");
  tiles.innerHTML = Object.entries(kinds).map(([k, n]) =>
    `<div class="tile"><div class="v">${n}</div><div class="k">${esc(k)}${n > 1 ? "s" : ""}</div>
      <div class="sub">${esc(KIND_NOTE[k] || "")}</div></div>`).join("");
  v.appendChild(tiles);

  const c = el("div", "card");
  c.style.marginTop = "18px";
  c.innerHTML = "<h3 style='margin-top:0'>Nodes contributed, by platform</h3>";
  c.appendChild(barChart(Object.entries(DATA.instances.byPlatform).map(([k, n]) => ({
    k, v: n, note: (srcByPlatform[k] || []).length + " payload(s) behind it"
  })), {unit: "nodes"}));
  c.appendChild(el("p", "muted", `<span style="font-size:11.5px">ecosyste.ms is missing
    from this chart on purpose: its two payloads contributed properties to the
    repository node rather than nodes of their own, so it has no
    <code>ExtractionOutput</code> to attribute them to — the same gap ask #4
    describes for the platform enumeration.</span>`));
  v.appendChild(c);

  const groups = {};
  DATA.sources.forEach(s => (groups[s.platform] = groups[s.platform] || []).push(s));
  const h = el("div");
  h.innerHTML = "<h2>Every payload</h2>";
  v.appendChild(h);
  Object.entries(groups).sort((a, b) => a[0].localeCompare(b[0])).forEach(([plat, list]) => {
    const card = el("div", "card");
    card.style.marginBottom = "12px";
    const nodes = DATA.instances.byPlatform[plat];
    card.innerHTML = `<div class="detail-head" style="margin-bottom:8px">
        <h2 style="margin:0;font-size:14px">${esc(plat)}</h2>
        <span class="pill">${list.length} payload${list.length > 1 ? "s" : ""}</span>
        ${nodes ? `<span class="pill">${nodes} nodes in the graph</span>`
          : `<span class="pill">no ExtractionOutput of its own</span>`}
        ${list[0].builder ? `<span class="pill mono" style="font-size:10.5px">${
          esc(list[0].builder)}</span>` : ""}</div>`;
    const sc = el("div", "scrollx");
    sc.innerHTML = `<table><thead><tr><th>kind</th><th>request URL or path</th>
      <th>captured</th><th class="num">rows</th><th>payload on disk</th></tr></thead><tbody>${
      list.map(s => `<tr>
        <td class="nowrap muted">${esc(s.kind)}</td>
        <td>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener"
            class="mono" style="font-size:11.5px">${esc(s.url)}</a>`
          : `<span class="mono muted" style="font-size:11.5px">${esc(s.path || "—")}</span>`}
          ${s.note ? `<div class="muted" style="font-size:11px">${esc(s.note)}</div>` : ""}</td>
        <td class="nowrap muted" style="font-size:11.5px">${esc(s.capturedAt || "—")}</td>
        <td class="num">${s.rows != null ? esc(String(s.rows)) : ""}</td>
        <td class="mono muted" style="font-size:11px">${esc(s.url ? (s.path || "") : "")}</td>
      </tr>`).join("")}</tbody></table>`;
    card.appendChild(sc);
    v.appendChild(card);
  });

  const obs = el("div");
  obs.innerHTML = `<h2>The provenance layer, value by value</h2>
    <p class="lede" style="margin-bottom:12px">${DATA.observations.length}
      <code>pulse:Observation</code> nodes — §18(4)'s non-RDF-star encoding. Each one
      records a single claimed value, the URL it was read from and when. This is the
      part of the model that survives two sources disagreeing.</p>`;
  const osc = el("div", "scrollx");
  osc.innerHTML = `<table><thead><tr><th>subject</th><th>property</th><th>value</th>
    <th>retrieved from</th><th>at</th><th>platform</th><th>kind</th></tr></thead><tbody>${
    DATA.observations.map(o => `<tr>
      <td class="mono" style="font-size:11px;max-width:210px;overflow-wrap:anywhere">${
        esc(o.subject)}</td>
      <td class="nowrap">${T[o.property] ? `<button class="tag link" data-go="${
        esc(o.property)}">${esc(o.property)}</button>` : esc(o.property)}</td>
      <td style="max-width:190px;overflow-wrap:anywhere">${esc(o.value)}</td>
      <td style="max-width:230px;overflow-wrap:anywhere"><a href="${esc(o.url)}"
        target="_blank" rel="noopener" class="mono" style="font-size:11px">${esc(o.url)}</a></td>
      <td class="nowrap muted" style="font-size:11px">${esc(o.at.slice(0, 19))}</td>
      <td class="nowrap">${esc(o.platform)}</td>
      <td class="nowrap muted">${esc(o.obsKind)}</td></tr>`).join("")}</tbody></table>`;
  obs.appendChild(osc);
  v.appendChild(obs);
}

/* --------------------------------------------------------- all terms */
const tstate = {sort: "curie", dir: 1, q: "", kind: "all"};
function renderTerms() {
  const v = $("#v-terms");
  v.innerHTML = `<h1>All ${all.length} terms</h1>
    <p class="lede">The table view: everything at once, sortable. <code>triples</code> counts
      how often real data actually used the term — a zero there is a term no platform we read
      has exercised yet.</p>`;
  const f = el("div", "filters");
  f.innerHTML = ["all", "class", "property", "member"].map(k =>
    `<button class="chip" data-kind="${k}" aria-pressed="${tstate.kind === k}">${
      k === "all" ? "everything" : k + "es"}</button>`).join("") +
    `<input class="chip" id="tq" placeholder="filter…" style="padding:4px 10px" value="${esc(tstate.q)}">`;
  v.appendChild(f);
  const sc = el("div", "scrollx");
  v.appendChild(sc);

  function paint() {
    const q = tstate.q.toLowerCase();
    const rows = all.filter(t => (tstate.kind === "all" || t.kind === tstate.kind) &&
      (!q || (t.curie + " " + t.label + " " + t.definition + " " + t.mapsFrom.join(" "))
        .toLowerCase().includes(q)))
      .sort((a, b) => {
        const k = tstate.sort;
        const av = k === "uses" || k === "instances" ? a[k] : String(a[k] || "");
        const bv = k === "uses" || k === "instances" ? b[k] : String(b[k] || "");
        return (av > bv ? 1 : av < bv ? -1 : 0) * tstate.dir;
      });
    const cols = [["curie", "term"], ["kind", "kind"], ["origin", "origin"],
      ["label", "label"], ["uses", "triples"], ["instances", "instances"]];
    sc.innerHTML = `<table><thead><tr>${cols.map(([k, l]) =>
      `<th class="sortable${k === "uses" || k === "instances" ? " num" : ""}" data-sort="${k}">${l}${
        tstate.sort === k ? (tstate.dir > 0 ? " ↑" : " ↓") : ""}</th>`).join("")}
      <th>stated in</th><th>GME field</th><th>platforms</th></tr></thead><tbody>${rows.map(t => `<tr>
        <td class="nowrap"><button class="tag link" data-go="${esc(t.curie)}">${esc(t.curie)}</button></td>
        <td class="muted">${esc(t.kind)}</td>
        <td class="nowrap">${originDot(t.origin)} <span class="muted" style="font-size:11.5px">${
          esc(t.origin)}</span></td>
        <td>${esc(t.label)}</td>
        <td class="num">${t.uses || ""}</td>
        <td class="num">${t.instances || ""}</td>
        <td class="nowrap" style="font-size:11px">${(t.declaredIn || []).slice(0, 1).map(dc =>
          dc.url ? `<a href="${esc(dc.url)}" target="_blank" rel="noopener" class="mono">${
            esc(dc.line ? dc.file + ":" + dc.line : dc.file)}</a>`
            : `<span class="mono muted">${esc(dc.file)}:${dc.line}</span>`).join("")}</td>
        <td class="mono muted" style="font-size:11px">${esc(t.mapsFrom.join(" "))}</td>
        <td class="muted" style="font-size:11px">${esc(t.platforms.join(" "))}</td></tr>`).join("")}
      </tbody></table>`;
    sc.querySelectorAll("[data-sort]").forEach(th => th.addEventListener("click", () => {
      const k = th.dataset.sort;
      tstate.dir = tstate.sort === k ? -tstate.dir : (k === "uses" || k === "instances" ? -1 : 1);
      tstate.sort = k; paint();
    }));
  }
  f.querySelectorAll("[data-kind]").forEach(b => b.addEventListener("click", () => {
    tstate.kind = b.dataset.kind;
    f.querySelectorAll("[data-kind]").forEach(x =>
      x.setAttribute("aria-pressed", x.dataset.kind === tstate.kind));
    paint();
  }));
  $("#tq", f).addEventListener("input", e => { tstate.q = e.target.value; paint(); });
  paint();
}

/* ---------------------------------------------------------- navigation */
const VIEWS = [
  {id: "overview", label: "Overview", n: () => DATA.sections.length + " sections", render: renderOverview},
  {id: "classes", label: "Classes", n: () => classes.length, render: renderClasses},
  {id: "network", label: "Network", n: () => DATA.network.links.length + " edges", render: renderNetwork},
  {id: "shapes", label: "Shapes", n: () => DATA.shapes.length, render: renderShapes},
  {id: "align", label: "Alignment", n: () => DATA.alignments.length, render: renderAlign},
  {id: "enums", label: "Enumerations", n: () => members.length, render: renderEnums},
  {id: "sources", label: "Sources", n: () => DATA.sources.length, render: renderSources},
  {id: "terms", label: "All terms", n: () => all.length, render: renderTerms}
];
const painted = {};
function setView(id, skipHash) {
  const v = VIEWS.find(x => x.id === id) || VIEWS[0];
  VIEWS.forEach(x => { $("#v-" + x.id).hidden = x.id !== v.id; });
  $("#nav").querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-current", b.dataset.view === v.id));
  if (!painted[v.id]) { v.render(); painted[v.id] = true; }
  if (v.id === "network") requestAnimationFrame(buildNet);
  if (!skipHash) location.hash = "#" + v.id + (v.id === "classes" && cstate.sel ?
    "/" + cstate.sel : "");
  scrollTo({top: 0});
}
function goTerm(curie) {
  const t = T[curie];
  if (!t) return;
  if (t.kind === "member") {
    setView("enums");
    return;
  }
  if (t.kind === "class") { cstate.sel = curie; cstate.origin = "all"; cstate.dataOnly = false;
    setView("classes"); if (cstate.paint) cstate.paint(); return; }
  // a property: show it in the detail panel of the classes view
  cstate.sel = curie; setView("classes");
  const d = $("#v-classes .detail");
  if (d) { d.innerHTML = ""; d.appendChild(termCard(curie)); }
  location.hash = "#classes/" + curie;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b) { e.preventDefault(); goTerm(b.dataset.go); }
});

/* -------------------------------------------------------------- search */
const index = all.map(t => ({t, hay: (t.curie + " " + t.label + " " + t.definition + " " +
  t.mapsFrom.join(" ")).toLowerCase()}));
const qEl = $("#q"), resEl = $("#results");
let sel = 0, hits = [];
function runSearch() {
  const q = qEl.value.trim().toLowerCase();
  if (!q) { resEl.classList.remove("open"); return; }
  hits = index.filter(x => x.hay.includes(q))
    .sort((a, b) => a.t.curie.toLowerCase().indexOf(q) - b.t.curie.toLowerCase().indexOf(q) ||
      a.t.curie.length - b.t.curie.length).slice(0, 24);
  sel = 0;
  resEl.innerHTML = hits.length ? hits.map((h, i) => `<button data-i="${i}" class="${
    i === 0 ? "sel" : ""}">${originDot(h.t.origin)} <b>${esc(h.t.curie)}</b>
    <span class="muted" style="font-size:11.5px">${esc(h.t.kind)}</span>
    <span class="r-def">${esc((h.t.definition || h.t.label).slice(0, 110))}</span></button>`).join("")
    : `<div style="padding:9px 11px" class="muted">nothing matches “${esc(q)}”</div>`;
  resEl.classList.add("open");
  resEl.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    goTerm(hits[+b.dataset.i].t.curie); resEl.classList.remove("open"); qEl.blur();
  }));
}
qEl.addEventListener("input", runSearch);
qEl.addEventListener("focus", runSearch);
qEl.addEventListener("keydown", e => {
  if (e.key === "Escape") { resEl.classList.remove("open"); qEl.blur(); return; }
  if (!hits.length) return;
  if (e.key === "Enter") { goTerm(hits[sel].t.curie); resEl.classList.remove("open"); qEl.blur(); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    sel = (sel + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length;
    resEl.querySelectorAll("button").forEach((b, i) => b.classList.toggle("sel", i === sel));
    const cur = resEl.querySelector("button.sel");
    if (cur) cur.scrollIntoView({block: "nearest"});
  }
});
document.addEventListener("click", e => {
  if (!e.target.closest(".search")) resEl.classList.remove("open");
});
document.addEventListener("keydown", e => {
  if ((e.key === "/" || (e.key === "k" && (e.metaKey || e.ctrlKey))) &&
      document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); qEl.select(); }
});

/* ---------------------------------------------------------------- boot */
$("#brandSub").innerHTML = `${esc(M.upstreamRepo)}<br>${esc(M.upstreamBranch)}<br>
  <span class="mono">@${esc(M.upstreamRef)}</span> · GME ${esc(M.gmeVersion)}`;
$("#sideFoot").innerHTML = `Generated from the Turtle in <code>dev/v4.0.0/</code> by
  <code>build_explorer.py</code>. Upstream is CC-BY-SA-4.0.<br><br>
  ${M.triplesUpstream} upstream + ${M.triplesProposed} proposed triples ·
  ${M.triplesShapes} in shapes · ${M.triplesInstance} of real instance data.<br><br>
  Press <b>/</b> to search.`;
$("#nav").innerHTML = VIEWS.map(v =>
  `<button data-view="${v.id}"><span>${v.label}</span><span class="n">${v.n()}</span></button>`).join("");
$("#nav").querySelectorAll("button").forEach(b =>
  b.addEventListener("click", () => setView(b.dataset.view)));
$("#themeBtn").addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.getAttribute("data-theme") || (dark ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  if (painted.network) buildNet();
});
addEventListener("resize", () => { if (painted.network && !$("#v-network").hidden) buildNet(); });
function fromHash() {
  const [id, term] = location.hash.replace(/^#/, "").split("/");
  if (term && T[decodeURIComponent(term)]) { goTerm(decodeURIComponent(term)); return; }
  setView(id || "overview", true);
}
addEventListener("hashchange", fromHash);
fromHash();
})();
</script>
</body>
</html>
