<html lang="en">

<style>
/* ---------------------------------------------------------------- tokens */
:root {
  color-scheme: light;
  --plane:        #f9f9f7;
  --surface:      #fcfcfb;
  --surface-2:    #f2f1ed;
  --ink:          #0b0b0b;
  --ink-2:        #52514e;
  --ink-muted:    #898781;
  --grid:         #e1e0d9;
  --axis:         #c3c2b7;
  --hairline:     rgba(11,11,11,.10);
  /* categorical — 3 slots only: the documented all-pairs safe subset */
  --c-upstream:   #2a78d6;
  --c-proposed:   #eb6834;
  --c-external:   #1baf7a;
  --seq:          #2a78d6;
  --seq-soft:     #cde2fb;
  --good:         #0ca30c;
  --warning:      #fab219;
  --critical:     #d03b3b;
  --shadow:       0 1px 2px rgba(11,11,11,.06), 0 8px 24px rgba(11,11,11,.06);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
    --ink: #fff; --ink-2: #c3c2b7; --ink-muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --hairline: rgba(255,255,255,.10);
    --c-upstream: #3987e5; --c-proposed: #d95926; --c-external: #199e70;
    --seq: #3987e5; --seq-soft: #184f95;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
  --ink: #fff; --ink-2: #c3c2b7; --ink-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --hairline: rgba(255,255,255,.10);
  --c-upstream: #3987e5; --c-proposed: #d95926; --c-external: #199e70;
  --seq: #3987e5; --seq-soft: #184f95;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--plane); color: var(--ink); font-family: var(--sans);
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
a { color: var(--c-upstream); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: .92em; }

/* ---------------------------------------------------------------- shell */
.app { display: grid; grid-template-columns: 232px minmax(0,1fr); min-height: 100vh; }
.sidebar {
  border-right: 1px solid var(--hairline); background: var(--surface);
  padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { font-weight: 650; letter-spacing: -.01em; margin: 0 0 2px; font-size: 15px; }
.brand-sub { color: var(--ink-muted); font-size: 11.5px; margin-bottom: 18px; line-height: 1.4; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  background: none; border: 0; text-align: left; padding: 7px 9px;
  border-radius: 7px; cursor: pointer; color: var(--ink-2);
}
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.nav .n { color: var(--ink-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.side-foot { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--hairline);
  color: var(--ink-muted); font-size: 11px; line-height: 1.6; }
main { padding: 0 0 64px; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; gap: 12px; align-items: center;
  padding: 12px 24px; background: color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--hairline);
}
.search { position: relative; flex: 1; max-width: 460px; }
.search input {
  width: 100%; padding: 8px 11px; border-radius: 8px; background: var(--surface);
  border: 1px solid var(--hairline); color: var(--ink); font: inherit;
}
.search input:focus { outline: 2px solid var(--c-upstream); outline-offset: -1px; }
.results {
  position: absolute; top: calc(100% + 5px); left: 0; right: 0; z-index: 40;
  background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px;
  box-shadow: var(--shadow); max-height: 380px; overflow-y: auto; display: none;
}
.results.open { display: block; }
.results button {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  padding: 7px 11px; cursor: pointer; border-bottom: 1px solid var(--hairline);
}
.results button:last-child { border-bottom: 0; }
.results button:hover, .results button.sel { background: var(--surface-2); }
.results .r-def { color: var(--ink-muted); font-size: 11.5px; display: block;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }
.view { padding: 22px 24px 0; max-width: 1320px; }
.view[hidden] { display: none; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.015em; }
h2 { font-size: 15px; margin: 26px 0 10px; letter-spacing: -.01em; }
h3 { font-size: 13px; margin: 18px 0 8px; color: var(--ink-2); text-transform: uppercase;
  letter-spacing: .06em; font-weight: 600; }
.lede { color: var(--ink-2); max-width: 74ch; margin: 0 0 18px; }
.card { background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 12px; padding: 16px 18px; }

/* ------------------------------------------------------------ stat tiles */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(158px,1fr)); }
.tile { background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 12px; padding: 13px 15px; }
.tile .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.tile .k { color: var(--ink-muted); font-size: 11.5px; margin-top: 2px; }
.tile .sub { color: var(--ink-2); font-size: 11.5px; margin-top: 6px; }
.hero { display: flex; align-items: baseline; gap: 10px; }
.hero .from { font-size: 26px; color: var(--ink-muted); text-decoration: line-through;
  text-decoration-thickness: 1px; }
.hero .arrow { color: var(--ink-muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
  padding: 2px 7px; border-radius: 999px; border: 1px solid var(--hairline);
  color: var(--ink-2); background: var(--surface-2); white-space: nowrap; }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
/* inline-block, not inline: an inline box ignores width/height and collapses */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.sq { border-radius: 2px; }
.dot.di { border-radius: 2px; transform: rotate(45deg); }

/* ---------------------------------------------------------------- charts */
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 168px minmax(0,1fr) 52px;
  gap: 10px; align-items: center; cursor: default; }
.bar-row.click { cursor: pointer; }
.bar-row.click:hover .bar-label { color: var(--ink); }
.bar-label { color: var(--ink-2); font-size: 12px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 10px; background: var(--grid); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--seq); border-radius: 0 4px 4px 0;
  min-width: 2px; transition: width .3s ease; }
.bar-val { font-size: 12px; color: var(--ink-2); text-align: right;
  font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 0;
  color: var(--ink-2); font-size: 11.5px; }
.legend span.li { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { flex: none; }

/* --------------------------------------------------------------- classes */
.split { display: grid; grid-template-columns: 296px minmax(0,1fr); gap: 18px;
  align-items: start; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { border: 1px solid var(--hairline); background: var(--surface);
  border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink); }
.seg { display: inline-flex; gap: 0; }
.seg .chip { border-radius: 0; }
.seg .chip:first-child { border-radius: 999px 0 0 999px; }
.seg .chip:last-child { border-radius: 0 999px 999px 0; margin-left: -1px; }
.opts { display: grid; gap: 9px 20px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px;
  padding: 13px 16px; margin: -6px 0 14px; }
.opts[hidden] { display: none; }
.opt { display: grid; grid-template-columns: 92px minmax(0,1fr) 34px; gap: 9px;
  align-items: center; font-size: 12px; color: var(--ink-2); }
.opt output { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-muted); }
.opt input[type=range] { accent-color: var(--seq); width: 100%; }
.list { border: 1px solid var(--hairline); border-radius: 12px; overflow: hidden;
  background: var(--surface); max-height: calc(100vh - 190px); overflow-y: auto; }
.list-group { padding: 8px 12px 4px; color: var(--ink-muted); font-size: 10.5px;
  text-transform: uppercase; letter-spacing: .07em; background: var(--surface-2);
  position: sticky; top: 0; }
.list button {
  display: flex; align-items: center; gap: 8px; width: 100%; background: none;
  border: 0; border-top: 1px solid var(--hairline); padding: 8px 12px;
  text-align: left; cursor: pointer;
}
.list button:hover { background: var(--surface-2); }
.list button[aria-current="true"] { background: var(--surface-2); font-weight: 600;
  box-shadow: inset 3px 0 0 var(--ink); }
.list .li-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.list .li-n { color: var(--ink-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.detail { min-width: 0; }
.detail-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.detail h1 { margin: 0; }
.iri { color: var(--ink-muted); font-size: 11.5px; word-break: break-all; margin: 4px 0 12px; }
.def { max-width: 78ch; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: 152px minmax(0,1fr); gap: 6px 14px;
  margin: 14px 0; font-size: 13px; }
.kv dt { color: var(--ink-muted); font-size: 11.5px; padding-top: 2px; }
.kv dd { margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.srcs { list-style: none; margin: 0; padding: 0; }
.srcs li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 4px 0; border-top: 1px solid var(--hairline); font-size: 12px; }
.srcs li:first-child { border-top: 0; }
.src-url { font-size: 11px; overflow-wrap: anywhere; max-width: 100%; }
.tag { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 5px;
  background: var(--surface-2); border: 1px solid var(--hairline); color: var(--ink-2); }
.tag.link { cursor: pointer; }
.tag.link:hover { color: var(--ink); border-color: var(--axis); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.scrollx { overflow-x: auto; border: 1px solid var(--hairline); border-radius: 12px;
  background: var(--surface); }
th { text-align: left; font-weight: 600; color: var(--ink-muted); font-size: 11px;
  text-transform: uppercase; letter-spacing: .05em; padding: 9px 12px;
  border-bottom: 1px solid var(--grid); white-space: nowrap; position: sticky; top: 0;
  background: var(--surface); }
td { padding: 8px 12px; border-bottom: 1px solid var(--grid); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--surface-2); }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-muted); }
.nowrap { white-space: nowrap; }

/* --------------------------------------------------------------- network */
.net-wrap { position: relative; border: 1px solid var(--hairline); border-radius: 12px;
  background: var(--surface); overflow: hidden; }
#net { display: block; width: 100%; height: clamp(430px, 72vh, 760px);
  touch-action: none; cursor: grab; }
#net.dragging { cursor: grabbing; }
/* Below the board, not on top of it — an overlay legend always covers nodes. */
.net-legend { display: grid; gap: 2px 26px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  border: 1px solid var(--hairline); border-top: 0; border-radius: 0 0 12px 12px;
  background: var(--surface); padding: 10px 14px 12px; font-size: 11.5px; color: var(--ink-2);
  margin: -1px 0 0; }
.net-legend .row { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.net-legend .row .li { display: inline-flex; align-items: center; gap: 6px; }
/* .hd, not `b` — a bare element selector here also restyled the inline <b> in
   the footnote, which came out as a stray uppercase block */
.net-legend .hd { color: var(--ink); font-weight: 600; display: block; margin: 2px 0 3px;
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
.net-legend .foot { grid-column: 1/-1; color: var(--ink-muted); margin-top: 4px; font-size: 11px; }
.net-side { position: absolute; right: 12px; top: 12px; width: min(300px, 46%);
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  border: 1px solid var(--hairline); border-radius: 10px; padding: 12px 13px;
  box-shadow: var(--shadow); max-height: calc(100% - 24px); overflow-y: auto; }
.net-side[hidden] { display: none; }
.net-side h4 { margin: 0 0 2px; font-size: 13.5px; }
.net-side ul { margin: 6px 0 0; padding-left: 0; list-style: none; }
.net-side li { padding: 3px 0; border-top: 1px solid var(--hairline); font-size: 12px; }
.net-side .close { position: absolute; right: 8px; top: 7px; background: none;
  border: 0; cursor: pointer; color: var(--ink-muted); font-size: 15px; line-height: 1; }
.tooltip {
  position: fixed; z-index: 60; pointer-events: none; opacity: 0; transition: opacity .1s;
  background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
  box-shadow: var(--shadow); padding: 7px 9px; font-size: 12px; max-width: 320px;
}
.tooltip.on { opacity: 1; }
.tooltip .t-h { font-weight: 600; }
.tooltip .t-d { color: var(--ink-2); font-size: 11.5px; }
.node-label { font-size: 10.5px; fill: var(--ink); paint-order: stroke;
  stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.edge { fill: none; stroke: var(--axis); }
.edge.observed { stroke: var(--ink-muted); }
.node-hit { cursor: pointer; }

/* ----------------------------------------------------------- responsive */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; border-right: 0;
    border-bottom: 1px solid var(--hairline); }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .side-foot { display: none; }
  .split { grid-template-columns: 1fr; }
  .list { max-height: 320px; }
  .net-side { position: static; width: auto; max-height: none; margin: 0 12px 12px; }
  .net-legend { position: static; margin: 12px; max-width: none; }
  .bar-row { grid-template-columns: 120px minmax(0,1fr) 46px; }
}
@media print, (forced-colors: active) {
  .sidebar, .topbar { display: none; }
  .view[hidden] { display: block; }
}
</style>

<body>
<div class="app">
  <aside class="sidebar">
    <p class="brand">Raw profile explorer</p>
    <p class="brand-sub" id="brandSub"></p>
    <nav class="nav" id="nav" aria-label="Views"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main>
    <div class="topbar">
      <div class="search">
        <input id="q" type="search" placeholder="Search terms, definitions, GME fields…"
               autocomplete="off" aria-label="Search terms">
        <div class="results" id="results" role="listbox"></div>
      </div>
      <button class="icon-btn" id="themeBtn" title="Toggle light / dark">◐</button>
    </div>

    <section class="view" id="v-overview"></section>
    <section class="view" id="v-classes" hidden></section>
    <section class="view" id="v-network" hidden></section>
    <section class="view" id="v-shapes" hidden></section>
    <section class="view" id="v-align" hidden></section>
    <section class="view" id="v-enums" hidden></section>
    <section class="view" id="v-sources" hidden></section>
    <section class="view" id="v-terms" hidden></section>
  </main>
</div>
<div class="tooltip" id="tip" role="status"></div>

<script>
const DATA=/*__DATA__*/null;
(function () {
"use strict";
const T = DATA.terms, M = DATA.meta;
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el = (tag, cls, html) => { const n = document.createElement(tag);
  if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

const ORIGIN = {
  proposed: {label: "proposed by GME", color: "var(--c-proposed)", shape: "circle"},
  extended: {label: "theirs, extended", color: "var(--c-upstream)", shape: "circle", ring: true},
  upstream: {label: "in PR #25 already", color: "var(--c-upstream)", shape: "circle"},
  external: {label: "external vocabulary", color: "var(--c-external)", shape: "square"}
};
const originDot = o => `<span class="dot ${ORIGIN[o] && ORIGIN[o].shape === "square" ? "sq" : ""}"
  style="background:${(ORIGIN[o] || {}).color || "var(--ink-muted)"}${
  ORIGIN[o] && ORIGIN[o].ring ? ";box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--c-upstream)" : ""}"></span>`;
const originPill = o => `<span class="pill">${originDot(o)}${esc((ORIGIN[o] || {}).label || o)}</span>`;

const all = Object.values(T);
const isEnumClass = c => c.endsWith("Enumeration");
const classes = all.filter(t => t.kind === "class" && !isEnumClass(t.curie));
const enumClasses = all.filter(t => t.kind === "class" && isEnumClass(t.curie));
const props = all.filter(t => t.kind === "property");
const members = all.filter(t => t.kind === "member");
const platforms = Object.keys(DATA.instances.byPlatform);
const sectionOf = {};
DATA.sections.forEach(s => s.terms.forEach(c => { if (!sectionOf[c]) sectionOf[c] = s; }));

/* ------------------------------------------------------------ tooltip */
const tip = $("#tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.classList.add("on");
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 12;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => tip.classList.remove("on");
function bindTip(node, htmlFn) {
  node.addEventListener("pointermove", e => showTip(e, htmlFn()));
  node.addEventListener("pointerleave", hideTip);
}

/* -------------------------------------------------------------- charts */
function barChart(rows, opts) {
  const o = opts || {}, max = Math.max(1, ...rows.map(r => r.v));
  const wrap = el("div", "bars");
  rows.forEach(r => {
    const row = el("div", "bar-row" + (r.go ? " click" : ""));
    row.innerHTML = `<div class="bar-label">${esc(r.k)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(r.v / max * 100).toFixed(1)}%${
        r.color ? ";background:" + r.color : ""}"></div></div>
      <div class="bar-val">${r.v.toLocaleString()}</div>`;
    bindTip(row, () => `<div class="t-h">${esc(r.k)} — ${r.v.toLocaleString()} ${
      esc(o.unit || "")}</div>${r.note ? `<div class="t-d">${esc(r.note)}</div>` : ""}`);
    if (r.go) row.addEventListener("click", r.go);
    wrap.appendChild(row);
  });
  return wrap;
}

/* ------------------------------------------------------------ overview */
function renderOverview() {
  const v = $("#v-overview");
  const exercised = classes.filter(c => c.instances > 0).length;
  const proposedN = all.filter(t => t.origin === "proposed").length;
  const usedProps = props.filter(p => p.uses > 0).length;
  v.innerHTML = `
    <h1>The raw profile, as GME proposes it</h1>
    <p class="lede">Everything on this page is read out of the Turtle files in
      <code>dev/v4.0.0/</code> — no number is typed by hand. It covers what
      <b>${esc(M.upstreamRepo)}</b> ${esc(M.upstreamBranch)} publishes at commit
      <code>${esc(M.upstreamRef)}</code>, what we propose adding, and what
      ${platforms.length} real platforms actually produced when we ran it.</p>`;

  const tiles = el("div", "tiles");
  const tile = (v_, k, sub) => `<div class="tile"><div class="v">${v_}</div>
     <div class="k">${k}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
  tiles.innerHTML =
    `<div class="tile"><div class="v hero"><span class="from">${M.violationsBefore}</span>
       <span class="arrow">→</span><span style="color:var(--good)">${M.violationsAfter}</span></div>
       <div class="k">SHACL violations</div>
       <div class="sub"><span class="pill good">✓ conforms</span> with the asks applied</div></div>` +
    tile(classes.length, "classes", `${exercised} carry real instance data`) +
    tile(props.length, "properties", `${usedProps} exercised by real data`) +
    tile(proposedN, "terms we propose", "the rest is already theirs") +
    tile(platforms.length, "platforms", `${M.triplesInstance} triples of real data
      from ${DATA.sources.length} payloads`) +
    tile(DATA.alignments.length, "alignment axioms", `across ${
      new Set(DATA.alignments.map(a => a.vocab)).size} external vocabularies`);
  v.appendChild(tiles);

  const g = el("div");
  g.style.cssText = "display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));margin-top:26px";

  const c1 = el("div", "card", "<h3 style='margin-top:0'>Nodes produced, by platform</h3>");
  c1.appendChild(barChart(Object.entries(DATA.instances.byPlatform).map(([k, v_]) => ({
    k, v: v_, note: "nodes in the instance graph attributable to this platform"
  })), {unit: "nodes"}));
  c1.appendChild(el("p", "muted", `<span style="font-size:11.5px">GitHub dominates because it
    supplies the repository, its contributors and their identities. One node can be
    attributed to several platforms — that is the point of ask #22.</span>`));

  const c2 = el("div", "card", "<h3 style='margin-top:0'>Instances, by node type</h3>");
  c2.appendChild(barChart(Object.entries(DATA.instances.byClass).slice(0, 14).map(([k, v_]) => ({
    k, v: v_, go: T[k] ? () => goTerm(k) : null,
    note: T[k] ? (T[k].definition || "").slice(0, 140) : "not a declared class"
  })), {unit: "instances"}));

  const gaps = classes.filter(c => !c.instances && c.origin !== "external");
  // scoped to the raw profile: a class of theirs may well be shaped in their
  // canonical profile, which this proposal does not mirror
  const noShape = classes.filter(c => !c.shapes.length && c.origin !== "external");
  const c3 = el("div", "card", `<h3 style="margin-top:0">What is not covered</h3>
    <p class="muted" style="font-size:12px;margin:0 0 10px">Stated rather than hidden:
    a class with no instance is untested, and a class with no shape cannot be validated.</p>
    <dl class="kv">
      <dt>No real instance</dt><dd class="tags">${gaps.map(c =>
        `<button class="tag link" data-go="${esc(c.curie)}">${esc(c.curie)}</button>`).join("") ||
        "<span class='muted'>none</span>"}</dd>
      <dt>No shape in the raw profile</dt><dd class="tags">${noShape.map(c =>
        `<button class="tag link" data-go="${esc(c.curie)}">${esc(c.curie)}</button>`).join("") ||
        "<span class='muted'>none</span>"}</dd>
      <dt>Properties unexercised</dt><dd>${props.length - usedProps} of ${props.length}
        — mostly the ones behind an index that holds no rows yet</dd>
    </dl>`);

  g.append(c1, c2, c3);
  v.appendChild(g);

  const sec = el("div");
  sec.innerHTML = `<h2>The argument, section by section</h2>
    <p class="lede" style="margin-bottom:12px">${DATA.sections.length} sections of
      <code>ontology.ttl</code>, each one an ask with its own reasoning.</p>`;
  const grid = el("div");
  grid.style.cssText = "display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))";
  DATA.sections.forEach(s => {
    const c = el("div", "card");
    c.style.padding = "13px 15px";
    c.innerHTML = `<div style="display:flex;gap:8px;align-items:baseline">
        <span class="muted mono" style="font-size:11px">§${s.n}</span>
        <b style="font-size:13px">${esc(s.title)}</b></div>
      <p class="muted" style="font-size:11.5px;margin:6px 0 8px;line-height:1.45">${
        esc(s.blurb.slice(0, 190))}${s.blurb.length > 190 ? "…" : ""}</p>
      <div class="tags">${s.terms.slice(0, 6).map(t =>
        `<button class="tag link" data-go="${esc(t)}">${esc(t)}</button>`).join("")}${
        s.terms.length > 6 ? `<span class="tag muted">+${s.terms.length - 6}</span>` : ""}</div>`;
    grid.appendChild(c);
  });
  sec.appendChild(grid);
  v.appendChild(sec);
}

/* ------------------------------------------------------------- classes */
const cstate = {sel: null, origin: "all", platform: "all", dataOnly: false};
function renderClasses() {
  const v = $("#v-classes");
  v.innerHTML = `<h1>Classes</h1>
    <p class="lede">Every class in the raw profile: what it means, which GME field it
      rescues, what constrains it, and which platforms produced one.</p>`;

  const f = el("div", "filters");
  f.innerHTML =
    ["all", "proposed", "extended", "upstream"].map(o =>
      `<button class="chip" data-origin="${o}" aria-pressed="${cstate.origin === o}">${
        o === "all" ? "all origins" : esc((ORIGIN[o] || {}).label || o)}</button>`).join("") +
    `<button class="chip" data-dataonly aria-pressed="${cstate.dataOnly}">has real data</button>` +
    `<select class="chip" id="platSel" style="padding:4px 8px">
      <option value="all">any platform</option>${platforms.map(p =>
      `<option value="${esc(p)}"${cstate.platform === p ? " selected" : ""}>${esc(p)}</option>`).join("")}</select>`;
  v.appendChild(f);

  const split = el("div", "split");
  const list = el("div", "list");
  const detail = el("div", "detail");
  split.append(list, detail);
  v.appendChild(split);

  function paint() {
    const keep = c => (cstate.origin === "all" || c.origin === cstate.origin) &&
      (!cstate.dataOnly || c.instances > 0) &&
      (cstate.platform === "all" || c.platforms.indexOf(cstate.platform) >= 0);
    list.innerHTML = "";
    const groups = [["Classes", classes.filter(keep)], ["Enumerations", enumClasses.filter(keep)]];
    let first = null;
    groups.forEach(([name, items]) => {
      if (!items.length) return;
      list.appendChild(el("div", "list-group", `${name} · ${items.length}`));
      items.sort((a, b) => b.instances - a.instances ||
        a.curie.localeCompare(b.curie)).forEach(c => {
        if (!first) first = c.curie;
        const b = el("button");
        b.setAttribute("aria-current", cstate.sel === c.curie);
        b.innerHTML = `${originDot(c.origin)}<span class="li-name">${esc(c.curie)}</span>
          <span class="li-n">${c.instances || (DATA.enums[c.curie] || []).length || ""}</span>`;
        b.addEventListener("click", () => { cstate.sel = c.curie; paint(); });
        list.appendChild(b);
      });
    });
    if (!list.children.length) list.appendChild(el("div", "list-group", "nothing matches"));
    if (!cstate.sel || !T[cstate.sel]) cstate.sel = first || "pulse:Package";
    detail.innerHTML = "";
    detail.appendChild(termCard(cstate.sel));
  }
  f.querySelectorAll("[data-origin]").forEach(b => b.addEventListener("click", () => {
    cstate.origin = b.dataset.origin;
    f.querySelectorAll("[data-origin]").forEach(x =>
      x.setAttribute("aria-pressed", x.dataset.origin === cstate.origin));
    paint();
  }));
  f.querySelector("[data-dataonly]").addEventListener("click", e => {
    cstate.dataOnly = !cstate.dataOnly;
    e.currentTarget.setAttribute("aria-pressed", cstate.dataOnly); paint();
  });
  $("#platSel", f).addEventListener("change", e => { cstate.platform = e.target.value; paint(); });
  cstate.paint = paint;
  paint();
}

/* ---------------------------------------------------------- provenance bits */
const KIND_NOTE = {
  "committed snapshot": "a captured HTTP response committed to the test fixtures",
  "live capture": "fetched by fetch_live_sources.py, then replayed offline",
  "local index": "one of our own DuckDB stores",
  "bulk export": "a dated bulk download, not a request",
  "rete query": "range-read SPARQL against a published .rete graph"
};
// one source list per platform, so a term can name its actual payloads
const srcByPlatform = {};
DATA.sources.forEach((s, i) => (srcByPlatform[s.platform] = srcByPlatform[s.platform] || []).push(i));
const sourcesFor = t => (t.platforms || [])
  .flatMap(p => srcByPlatform[p] || []).map(i => DATA.sources[i]);

function declLinks(list) {
  if (!list || !list.length) return "";
  return `<div class="tags">${list.map(d => {
    const label = d.line ? `${d.file}:${d.line}` : d.file;
    const title = d.note ? ` title="${esc(d.note)}"` : "";
    return d.url
      ? `<a class="tag link" href="${esc(d.url)}" target="_blank" rel="noopener"${title}>${
          esc(label)} ↗</a>`
      : `<span class="tag"${title}>${esc(d.path ? d.path + ":" + d.line : label)}</span>`;
  }).join("")}</div>`;
}

function srcList(srcs) {
  const seen = new Set();
  const rows = srcs.filter(s => { const k = s.kind + s.name;
    if (seen.has(k)) return false; seen.add(k); return true; });
  return `<ul class="srcs">${rows.map(s => `<li>
    <span class="pill">${esc(s.platform)}</span>
    <span class="muted">${esc(s.kind)}</span>
    ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener" class="mono src-url">${
      esc(s.url)}</a>` : `<span class="mono src-url">${esc(s.path || "")}</span>`}
    ${s.capturedAt ? `<span class="muted nowrap">${esc(s.capturedAt)}</span>` : ""}
    ${s.rows != null ? `<span class="muted nowrap">${esc(String(s.rows))} rows</span>` : ""}
    ${s.note ? `<div class="muted" style="font-size:11px">${esc(s.note)}</div>` : ""}
  </li>`).join("")}</ul>`;
}

function constraintsFor(cls, path) {
  for (const s of DATA.shapes) {
    if (s.targetClass !== cls) continue;
    const p = s.properties.find(x => x.path === path);
    if (p) return p;
  }
  return null;
}
function card(cls) { const c = el("div", "card"); c.style.marginBottom = "14px"; return c; }

function termCard(curie) {
  const t = T[curie];
  const box = el("div");
  if (!t) { box.innerHTML = `<p class="muted">Unknown term <code>${esc(curie)}</code>.</p>`; return box; }
  const sec = sectionOf[curie];
  const enumMembers = DATA.enums[curie] || [];
  const shapesFor = DATA.shapes.filter(s => s.targetClass === curie);

  box.innerHTML = `
    <div class="detail-head">
      <h1>${esc(t.label || curie)}</h1>${originPill(t.origin)}
      ${t.instances ? `<span class="pill">${t.instances} instance${t.instances > 1 ? "s" : ""}</span>` : ""}
      ${t.uses ? `<span class="pill">${t.uses} triple${t.uses > 1 ? "s" : ""} of real data</span>` : ""}
      ${!t.instances && !t.uses ? `<span class="pill" title="no real data exercises this term yet">
        ○ not yet exercised</span>` : ""}
    </div>
    <div class="mono iri">${esc(curie)} &nbsp;·&nbsp; ${esc(t.iri)}</div>
    <p class="def">${esc(t.definition) || "<span class='muted'>No definition in the source files.</span>"}</p>
    ${t.note ? `<p class="def muted" style="font-size:12.5px"><b>Note:</b> ${esc(t.note)}</p>` : ""}`;

  const kv = el("dl", "kv");
  const row = (k, html) => { if (!html) return; kv.appendChild(el("dt", null, k));
    kv.appendChild(el("dd", null, html)); };
  const tagList = (arr, link) => arr.length ? `<div class="tags">${arr.map(x =>
    link && T[x] ? `<button class="tag link" data-go="${esc(x)}">${esc(x)}</button>`
      : `<span class="tag">${esc(x)}</span>`).join("")}</div>` : "";

  row("kind", `<span class="mono">${esc(t.kind)}</span>`);
  row("GME field it rescues", tagList(t.mapsFrom));
  row("subclass of", tagList(t.subClassOf, true));
  row("subproperty of", tagList(t.subPropertyOf, true));
  row("equivalent to", tagList(t.equivalent, true));
  row("inverse of", tagList(t.inverseOf, true));
  row("domain", tagList(t.domain, true));
  row("range", tagList(t.range, true));
  row("platforms seen", t.platforms.length ? `<div class="tags">${t.platforms.map(p =>
    `<span class="tag">${esc(p)}</span>`).join("")}</div>` : "<span class='muted'>none yet</span>");
  row("SHACL shape", shapesFor.length ? tagList(shapesFor.map(s => s.name)) :
    `<span class="muted">none — this class has no shape in the profile yet</span>`);
  row("argued in", sec ? `<span class="mono">§${sec.n}</span> ${esc(sec.title)}` : "");
  row("stated in", declLinks(t.declaredIn));
  if (t.emittedBy && t.emittedBy.length)
    row("instances emitted by", `<div class="tags">${t.emittedBy.map(b =>
      `<span class="tag">${esc(b)}</span>`).join("")}</div>`);
  const srcs = sourcesFor(t);
  // platform-level, not triple-level: we know which platforms produced this term
  // and every payload those platforms contributed, but only the Observation layer
  // pins an individual value to an individual request. Said plainly rather than
  // implied away.
  if (srcs.length) row("payloads behind it",
    `<p class="muted" style="margin:0 0 6px;font-size:11.5px">Attribution is
       platform-level: these are every payload the contributing platforms produced.
       Only the <a href="#sources">Observation rows</a> tie one value to one request.</p>` +
    srcList(srcs));
  box.appendChild(kv);

  if (enumMembers.length) {
    const c = card();
    c.innerHTML = `<h3 style="margin-top:0">${enumMembers.length} members</h3>
      <div class="tags">${enumMembers.map(m => `<button class="tag link" data-go="${esc(m)}"
        style="color:${T[m] && T[m].origin === "proposed" ? "var(--ink)" : "var(--ink-2)"}">${
        esc(m.split(":")[1])}${T[m] && T[m].origin === "proposed" ? " +" : ""}</button>`).join("")}</div>
      <p class="muted" style="font-size:11.5px;margin:8px 0 0">A <code>+</code> marks a member we
        propose adding. ${enumMembers.filter(m => T[m] && T[m].origin === "proposed").length} of
        ${enumMembers.length} here.</p>`;
    box.appendChild(c);
  }

  if (t.propsOut && t.propsOut.length) {
    const rows = [...new Set(t.propsOut)].sort().map(p => {
      const pt = T[p] || {curie: p, label: p, origin: "upstream", range: [], uses: 0, platforms: []};
      const con = constraintsFor(curie, p);
      return `<tr>
        <td class="nowrap">${originDot(pt.origin)}
          <button class="tag link" data-go="${esc(p)}">${esc(p)}</button></td>
        <td>${esc((pt.range || []).join(", ") || (con && (con.class || con.datatype)) || "—")}</td>
        <td class="nowrap muted">${con ? esc(`${con.minCount || 0}..${con.maxCount || "*"}`) : "—"}</td>
        <td class="num">${pt.uses || 0}</td>
        <td class="muted" style="font-size:11.5px">${esc((pt.platforms || []).join(" "))}</td></tr>`;
    }).join("");
    const c = el("div", "scrollx");
    c.innerHTML = `<table><thead><tr><th>property</th><th>range / datatype</th>
      <th>card.</th><th class="num">triples</th><th>platforms</th></tr></thead><tbody>${rows}</tbody></table>`;
    const h = el("div"); h.innerHTML = `<h3>${[...new Set(t.propsOut)].length} properties on this class</h3>`;
    h.appendChild(c); box.appendChild(h);
  }

  if (t.propsIn && t.propsIn.length) {
    const c = el("div");
    c.innerHTML = `<h3>Pointed at by</h3><div class="tags">${[...new Set(t.propsIn)].sort()
      .map(p => `<button class="tag link" data-go="${esc(p)}">${esc(p)}</button>`).join("")}</div>`;
    box.appendChild(c);
  }

  shapesFor.forEach(s => {
    const c = el("div");
    c.innerHTML = `<h3>${esc(s.name)}
      <span class="pill" style="text-transform:none;letter-spacing:0">sh:closed ${
        esc(s.closed || "—")}</span></h3>`;
    const sc = el("div", "scrollx");
    sc.innerHTML = `<table><thead><tr><th>path</th><th>class / datatype</th><th>card.</th>
      <th>node kind</th><th>pattern</th></tr></thead><tbody>${s.properties.map(p => `<tr>
        <td class="nowrap mono">${esc(p.path)}</td>
        <td>${esc(p.class || p.datatype || "—")}</td>
        <td class="nowrap muted">${esc(`${p.minCount || 0}..${p.maxCount || "*"}`)}</td>
        <td class="muted">${esc(p.nodeKind.replace("sh:", "") || "—")}</td>
        <td class="mono muted" style="font-size:11px">${esc(p.pattern.slice(0, 40))}</td></tr>`).join("")}
      </tbody></table>`;
    c.appendChild(sc); box.appendChild(c);
  });

  const netBtn = el("button", "chip", "→ show in the network");
  netBtn.style.marginTop = "14px";
  netBtn.addEventListener("click", () => { setView("network"); netFocus(curie); });
  box.appendChild(netBtn);
  return box;
}

/* ------------------------------------------------------------- network */
const EDGE = {
  property: {label: "declared property (domain → range)", dash: "", w: 1.7, op: .5},
  observed: {label: "actually observed in the real data", dash: "", w: 2.6, op: .8},
  shape: {label: "SHACL constraint (sh:class)", dash: "5 3", w: 1.6, op: .45},
  subclass: {label: "rdfs:subClassOf, inside Open Pulse", dash: "1 3", w: 1.7, op: .55},
  alignment: {label: "aligned to an external class", dash: "7 3", w: 1.7, op: .65},
  vocabAlignment: {label: "aligned to an external vocabulary", dash: "2 5", w: 1.7, op: .6}
};
const nstate = {
  layers: {structure: true, observed: true, alignment: true},
  sel: null, allLabels: false,
  mode: "pcb",        // "pcb" = grid-snapped orthogonal traces, "organic" = curves
  nodeScale: .62,     // pads default small; the slider goes up to 1.6
  spacing: 150,       // link rest length
  repulsion: 1,       // multiplier on the many-body term
  labelTop: 16,       // how many hubs keep a permanent label
  grid: 22            // PCB grid pitch, in px
};

function renderNetwork() {
  const v = $("#v-network");
  v.innerHTML = `<h1>The network</h1>
    <p class="lede">Every connection the profile draws, from four different sources:
      declared <code>domain</code>/<code>range</code>, SHACL <code>sh:class</code>
      constraints, alignment axioms, and — the thick lines — the edges the
      ${platforms.length}-platform instance graph <b>actually</b> produced.
      Drag to pan, scroll to zoom, click a node to isolate its neighbourhood.</p>`;

  const f = el("div", "filters");
  f.innerHTML = `
    <button class="chip" data-layer="structure" aria-pressed="${nstate.layers.structure}">structure</button>
    <button class="chip" data-layer="observed" aria-pressed="${nstate.layers.observed}">observed in real data</button>
    <button class="chip" data-layer="alignment" aria-pressed="${nstate.layers.alignment}">external alignment</button>
    <span class="seg" role="group" aria-label="Layout">
      <button class="chip" data-mode="pcb" aria-pressed="${nstate.mode === "pcb"}">board</button>
      <button class="chip" data-mode="organic" aria-pressed="${nstate.mode === "organic"}">organic</button>
    </span>
    <button class="chip" data-labels aria-pressed="${nstate.allLabels}">all labels</button>
    <button class="chip" data-opts aria-pressed="false">options ▾</button>
    <button class="chip" data-reset>reset view</button>`;
  v.appendChild(f);

  const opts = el("div", "opts");
  opts.hidden = true;
  const SLIDERS = [
    ["nodeScale", "pad size", .3, 1.6, .02],
    ["spacing", "trace length", 80, 300, 5],
    ["repulsion", "spread", .3, 2.5, .05],
    ["labelTop", "labelled hubs", 0, 44, 1],
    ["grid", "grid pitch", 10, 46, 2]
  ];
  opts.innerHTML = SLIDERS.map(([k, label, min, max, step]) =>
    `<label class="opt"><span>${label}</span>
      <input type="range" data-opt="${k}" min="${min}" max="${max}" step="${step}"
             value="${nstate[k]}" aria-label="${label}">
      <output data-out="${k}">${nstate[k]}</output></label>`).join("") +
    `<p class="muted" style="grid-column:1/-1;margin:2px 0 0;font-size:11px">
       Grid pitch applies to the board layout: nodes snap to it and traces run on it.</p>`;
  v.appendChild(opts);

  const wrap = el("div", "net-wrap");
  wrap.innerHTML = `<svg id="net" role="img" aria-label="Ontology class network"></svg>
    <div class="net-side" id="netSide" hidden></div>`;
  v.appendChild(wrap);

  const legend = el("div", "net-legend");
  legend.innerHTML = `
    <div><span class="hd">pad</span><div class="row">
      <span class="li"><span class="dot sq" style="background:var(--c-proposed)"></span>proposed by GME</span>
      <span class="li"><span class="dot sq" style="background:var(--c-upstream)"></span>already in PR #25</span>
      <span class="li"><span class="dot sq" style="background:var(--c-external)"></span>external class</span>
      <span class="li"><span class="dot di" style="background:var(--c-external)"></span>vocabulary hub</span>
    </div></div>
    <div><span class="hd">trace</span><div class="row" id="edgeLegend"></div></div>
    <div class="foot">Pad size = number of connections; the badge on a pad counts real
      instances; a ring marks a term of theirs that we extend. Everything is tunable
      under <b>options</b>.</div>`;
  v.appendChild(legend);
  $("#edgeLegend", legend).innerHTML = Object.entries(EDGE).map(([k, e]) =>
    `<span class="li"><svg width="24" height="8"><line x1="1" y1="4" x2="23" y2="4"
      stroke="var(--ink-muted)" stroke-width="${e.w}" ${e.dash ? `stroke-dasharray="${e.dash}"` : ""}/>
     </svg>${esc(e.label.replace(/ \(.*\)/, ""))}</span>`).join("");

  const tbl = el("div");
  tbl.innerHTML = `<h2>The same edges, as a table</h2>`;
  const sc = el("div", "scrollx");
  sc.style.maxHeight = "420px"; sc.style.overflowY = "auto";
  sc.innerHTML = `<table><thead><tr><th>from</th><th>via</th><th>to</th><th>kind</th>
    <th class="num">triples</th></tr></thead><tbody>${
    DATA.network.links.slice().sort((a, b) => b.count - a.count ||
      a.source.localeCompare(b.source)).map(l => `<tr>
      <td class="nowrap"><button class="tag link" data-go="${esc(l.source)}">${esc(l.source)}</button></td>
      <td class="mono" style="font-size:11.5px">${T[l.via] ?
        `<button class="tag link" data-go="${esc(l.via)}">${esc(l.via)}</button>` : esc(l.via)}</td>
      <td class="nowrap">${l.target.indexOf("vocab:") === 0 ? esc(l.target.slice(6)) :

      <td class="muted nowrap">${esc(l.kind)}</td>
      <td class="num">${l.count || ""}</td></tr>`).join("")}</tbody></table>`;
  tbl.appendChild(sc);

  f.querySelectorAll("[data-layer]").forEach(b => b.addEventListener("click", () => {
