.lede { color: var(--ink-2); max-width: 74ch; margin: 0 0 18px; }
.card { background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 12px; padding: 16px 18px; }

/* ------------------------------------------------------------ stat tiles */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(158px,1fr)); }
.tile { background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 12px; padding: 13px 15px; }
.tile .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }

.list button {

  text-align: left; cursor: pointer;
}
.list button:hover { background: var(--surface-2); }

.tooltip {

ab":"schema.org","prefix":"schema"}],"sections":[{"n":1,"title":"PACKAGES AND RELEASES","blurb":" This is the one that blocks a term you have already added. `pulse:dependsOn` is typed schema:SoftwareSourceCode -> schema:SoftwareSourceCode, but dependency data comes from GitHub's dependency-graph SBOM as PACKAGE coordinates: pypi:requests@2.31, maven:org.apache.commons:commons-lang3. There is no lossless way to emit dependsOn from that: - many packages have no public repository, and the SBOM does not carry one; - resolution costs one registry lookup per dependency; - \"depends on pypi:requests@2.31\" is a statement about a released artifact at a version — collapsing it to a repository IRI di","terms":["pulse:Package","pulse:packageIdentifier","pulse:packageEcosystem","pulse:packageVersion","pulse:packageRegistry","pulse:distributedAs","pulse:sourceRepository","pulse:dependsOnPackage","pulse:packageDependencyOf"]},{"n":2,"title":"CONTAINER ARTIFACTS AND DEPLOYMENT TOPOLOGY","blurb":" GME parses every docker-compose file in a repository (services, images, with ${VAR:-default} resolution) and resolves image references to their registry pages. Currently all of it is gme-internal:. pulse:externalReference is the closest existing term and it is a bare link, so the service/image structure is lost.  Note DockerHub is also absent from PlatformEnumeration (Section 8) while open-pulse-sources maintains a dockerhub index.","terms":["pulse:ContainerImage","pulse:publishesImage","pulse:referencesImage","pulse:imageReference","pulse:composeManifest"]},{"n":3,"title":"REPOSITORY HEALTH AND MATURITY","blurb":" The raw profile models hasWiki / hasPages / hasDiscussions but stops before the maturity signals. These are precisely what a research-software observatory gets asked (\"is this maintained? is it tested? is it citable?\"), and GME already derives all of them.","terms":["pulse:hasContinuousIntegration","pulse:testCoverage","pulse:communityHealthScore","pulse:badgeCount","pulse:hasIssues","pulse:hasProjects","pulse:hasIssueTemplate","pulse:hasPullRequestTemplate","pulse:contributingGuide","pulse:documentationUrl"]},{"n":4,"title":"REPOSITORY FACTS WITH NO HOME","blurb":"","terms":["pulse:sizeInBytes","pulse:forkNetworkCount","pulse:archivedDate","pulse:primaryProgrammingLanguage","pulse:profileReadme"]},{"n":5,"title":"REGISTRY ORGANIZATION METADATA","blurb":" pulse:OrganizationProfile is thin (platform, handle, name, url, internalId, description, location, followerCount, dateModified) and ROR is not a platform at all (Section 8), so authoritative registry facts about an organization have nowhere to land. GME reads all of these from ROR and Infoscience today.","terms":["pulse:establishedYear","pulse:registryStatus","pulse:acronym","pulse:unitCode"]},{"n":6,"title":"NAME VARIANTS — no new term proposed","blurb":" GME carries _aliases, _original_name, _orcid_other_names and _proposed_author_names. skos:altLabel already covers exactly this and both profiles already import SKOS. Our request is only that skos:altLabel be permitted on schema:Person, org:Organization and schema:SoftwareSourceCode in the shapes — the closed shapes currently exclude it, so the data is unexpressible despite the vocabulary existing.  Name variants are the single highest-value input to entity resolution: most failed person matches in our pipeline are a name written a second way.","terms":[]},{"n":7,"title":"PACKAGE ECOSYSTEM ENUMERATION","blurb":"","terms":["pulse:PackageEcosystemEnumeration","pulse:PyPI","pulse:Npm","pulse:Cargo","pulse:Maven","pulse:NuGet","pulse:GoModule","pulse:Conda","pulse:RubyGems","pulse:Docker","pulse:GitHubActions","pulse:OtherEcosystem"]},{"n":8,"title":"ENUMERATION MEMBERS TO ADD","blurb":" The cheapest changes in this file: no new classes, no shape edits.","terms":["pulse:ROR","pulse:DockerHub","pulse:OpenAlex","pulse:ETHZResearchCollection","pulse:SNSF","pulse:SWISSUbase","pulse:RenkuLab","pulse:EPFLGraph","pulse:CORDIS","pulse:SNSF_P3","pulse:DepsDev","pulse:Ecosystems","pulse:Crossref","pulse:GHArchive","pulse:InfoscienceScheme","pulse:OpenAlexScheme","pulse:RORScheme"]},{"n":9,"title":"GIT IDENTITIES — one person commits under many names and emails","blurb":" THE PROBLEM: canonical pulse:ContributionShape defines pulse:gitAuthorName and pulse:gitAuthorEmail, both with sh:maxCount 1, described as \"the author name as it literally appeared in the aggregated commits\" — singular. But a Contribution is one (person, repository) pair, and one person commits under SEVERAL (name, email) pairs: work laptop vs personal machine, a users.noreply.github.com address after enabling email privacy, a changed employer address, a typo'd name. That plurality is the entire reason .mailmap exists.  With maxCount 1 an extractor must pick one identity and silently discard ","terms":["pulse:GitIdentity","pulse:hasGitIdentity","pulse:gitIdentityOf","pulse:gitIdentityRole","pulse:isBotIdentity","pulse:isPseudonymousEmail","pulse:mailmapApplied","pulse:gitAuthorEmailDomain","pulse:gitAuthorEmailHash"]},{"n":10,"title":"SHACL FRAGMENTS","blurb":" Where the above would attach, as sh:property blocks to merge into the corresponding shapes rather than as standalone NodeShapes (adding a second sh:targetClass shape for schema:SoftwareSourceCode would fight the closed raw/canonical repository shapes, exactly as your raw shapes file warns).","terms":[]},{"n":13,"title":"REUSE AND ALIGNMENT — from the rete scholarly graphs","blurb":" Added 2026-07-31 after surveying the rete catalog and its alignment ontology (dev/rete/scholar.ttl v1.4.0). Two kinds of entry:  (a) ALIGNMENT of terms proposed above to vocabularies already in use by the sibling scholarly graphs, so our output joins them without a mapping table. Reuse beats minting, and these cost one axiom each. (b) TWO NEW TERMS that a real Zenodo record proved we cannot express.  VERIFICATION STATUS — their own review found several non-existent IRIs in this space (fabio:hasReference, six invented CiTO terms), so provenance is marked per line. LOV's term API was returning ","terms":["pulse:references","pulse:keyword","pulse:Funding","pulse:Collection","pulse:Package","pulse:DepositRelationEnumeration","pulse:DerivedFrom","pulse:SupplementTo","pulse:PartOf","pulse:DocumentedBy","pulse:depositRelation","pulse:accessRights"]},{"n":14,"title":"SOURCES WE READ BUT CANNOT TYPE","blurb":" From the source-by-source audit in raw-source-coverage.md. Each item below is a record kind or relation we receive from a source already wired into the pipeline, and currently discard because no term accepts it.  The EPFL Infoscience ontology (dev/rete/epfl-infoscience.ttl v1.2.0) is the evidence: it models DSpace-CRIS faithfully and therefore enumerates exactly what an Infoscience query returns. Our article agent queries Infoscience in production, so these are live gaps, not hypotheticals.  Following that ontology's own rule — reuse the standard, mint only the residue — most of this is enume","terms":["pulse:ThesisPublication","pulse:PatentPublication","pulse:publishedInVenue","pulse:issn","pulse:hasAdvisor","pulse:advisorOf","pulse:SciperScheme","pulse:orgUnitLevel","pulse:abstract"]},{"n":15,"title":"ROR, AND WHY WE ARE NOT ASKING FOR MANY MORE CLASSES","blurb":" rete's ROR vocabulary (dev/rete/scholar.ttl) is small and pointed: ror:Organization ⊑ scholar:Organization ror:Funder       ⊑ scholar:Funder ror:rorId ⊑ scholar:ror · ror:grid ⊑ scholar:grid ror:isni  ⊑ scholar:isni · ror:fundref ⊑ scholar:fundref ror:wikidata ⊑ scholar:wikidata  Note what rete does NOT do: it does not model a ROR *record* separate from the organization. Because the org is minted AT https://ror.org/{id}, the ROR node simply IS the organization, and its registry facts are properties of it. That is the same choice we make — our org:Organization @id is the ROR — so the natural h","terms":["pulse:RegistryRecord","pulse:hasRegistryRecord","pulse:WikidataScheme","pulse:CrossrefFunderScheme"]},{"n":16,"title":"BADGES AND DEPENDENCIES, MODELLED PROPERLY","blurb":" Correcting §3 and §1, which reduced these to pulse:badge (a link) and pulse:dependsOnPackage (an edge) plus counts. Both throw away the part we actually want.  A BADGE IS AN ASSERTION WITH A VALUE AND A SOURCE, not a link. What a README badge encodes: provider   Codecov, GitHub Actions, Zenodo, PyPI, conda-forge, JOSS, OpenSSF Scorecard, readthedocs … subject    what is being claimed — build status, coverage, DOI, version, downloads, licence, security score value      the claim itself — \"passing\", \"87%\", \"10.5281/zenodo.1234\", \"v1.2.3\" image + target URLs As one link we lose all four, and eve","terms":["pulse:Badge","pulse:hasBadge","pulse:badgeProvider","pulse:badgeSubject","pulse:badgeValue","pulse:badgeImage","pulse:badgeTarget","pulse:badgeAsserts","pulse:BadgeSubjectEnumeration","pulse:BuildStatusBadge","pulse:CoverageBadge","pulse:DoiBadge","pulse:PackageVersionBadge","pulse:DownloadsBadge","pulse:LicenseBadge","pulse:SecurityScoreBadge","pulse:DocumentationBadge","pulse:PublicationBadge","pulse:ChatBadge","pulse:FundingBadge","pulse:OtherBadgeSubject","pulse:DependencyRelation","pulse:hasDependency","pulse:dependencyTarget","pulse:dependencyScope","pulse:resolvedVersion","pulse:versionConstraint","pulse:declaredIn","pulse:isDirectDependency","pulse:DependencyScopeEnumeration","pulse:RuntimeDependency","pulse:DevelopmentDependency","pulse:BuildDependency","pulse:TestDependency","pulse:OptionalDependency"]},{"n":17,"title":"ORCID AFFILIATION TYPES — four of seven are missing","blurb":" ORCID v3.0 models SEVEN affiliation kinds, each its own endpoint: /employments  /educations  /qualifications  /invited-positions /distinctions  /memberships  /services  PR #25's MembershipTypeEnumeration has three — Employment, Education, SocietyMembership — so an extractor reading a full ORCID record has nowhere to put a qualification, an invited position, a distinction or a service. They collapse into \"membership\", which loses the distinction between \"held a chair at\", \"was awarded by\" and \"sat on a committee of\" — three quite different claims about a person's standing.  Cheap to close: fou","terms":["pulse:Qualification","pulse:InvitedPosition","pulse:Distinction","pulse:Service"]},{"n":18,"title":"COMPATIBILITY — accept everything, and say where it came from","blurb":" This is the point of the raw profile, so it deserves to be stated as a requirement rather than inferred: raw must accept whatever a source gives us, keep conflicting answers side by side, and record for every value WHERE it came from and WHEN it was queried. Five things currently stand in the way. All five are verified against ontology-shapes-raw.ttl, 2026-07-31.  --------------------------------------------------------------------- (1) NINE OF ELEVEN RAW SHAPES ARE sh:closed true  sh:closed false : RawPersonShape, RawOrganizationShape sh:closed true  : RawPlatformProfileShape, RawOrganizatio","terms":["pulse:Observation","pulse:hasObservation","pulse:observedSubject","pulse:observedProperty","pulse:observedValue","pulse:retrievedFrom","pulse:retrievedAt","pulse:sourceQuery","pulse:sourcePlatform","pulse:UnmappedField","pulse:hasUnmappedField","pulse:sourceFieldName","pulse:rawValue"]},{"n":19,"title":"deps.dev — the package layer already exists, and it joins on our IRIs","blurb":" The rete catalog ships deps.dev (Google Open Source Insights) as 2,555,320,067 triples across 8 federated shards. Verified live 2026-07-31 against https://data.graphplaza.com/deps-dev/deps-dev-pypi.rete:  9,221,041  deps:PackageVersion 431,715  deps:Project 23,795  deps:Advisory  THE JOIN IS FREE. deps:Project's own comment reads \"A source repository / project a package is built from (e.g. a GitHub repo). Instance IRI = the repository URL.\" That is GME's Repository @id. Querying that shard for  ?pv deps:hasProject <https://github.com/psf/requests> ; deps:purl ?purl  returns pkg:pypi/requests@","terms":["pulse:Package","pulse:packageIdentifier","pulse:packageEcosystem","pulse:packageRegistry","pulse:dependsOnPackage","pulse:packageDependencyOf","pulse:sourceRepository","pulse:isRelease","pulse:Advisory","pulse:hasAdvisory","pulse:advisoryAffects","pulse:advisorySource","pulse:advisorySeverity"]},{"n":20,"title":"PROJECT — canonical has it, raw does not","blurb":" Yes, the ontology has a project concept. It is only on one side:  ontology-definitions-canonical.ttl  schema:Project (\"A collaborative research endeavor with a particular aim, typically time-bounded and funded\"), pulse:projectOutput ontology-shapes-canonical.ttl       pulse:ProjectShape (sh:closed) — name, description, url, projectOutput (repo | article), schema:member, sourceOrganization, funder, hasBeginning/hasEnd ontology-shapes-raw.ttl             NOTHING. Zero occurrences of \"project\".  This is the same defect as the missing RawContributionShape (see ontology-shapes-raw.additions.ttl): ","terms":["pulse:fundsProject","pulse:fundedBy","pulse:awardNumber","pulse:grantAgreementIdentifier","pulse:fundingProgramme","pulse:Funding"]},{"n":21,"title":"ecosyste.ms — a second package/project source, and it joins the same way","blurb":" Researched 2026-08-06. Open API platform (code AGPL-3, data CC-BY-SA-4.0): 14.4m packages / 109 registries, 293m repos / ~1.95k hosts, 33.6k advisories, 889m commits, GitHub Sponsors and Open Collective money flows. OpenAPI 3.0.1 per service at https://<svc>.ecosyste.ms/docs/api/v1/openapi.yaml.  IDENTITY — it joins exactly like deps.dev. ecosyste.ms has a Project concept distinct from Repository and Package, and its identity is THE SOURCE REPOSITORY URL: /projects/lookup?url=https://github.com/numpy/numpy resolves. So a third source merges into our Repository node with no new IRI scheme. Two","terms":["pulse:issueTracker","pulse:developmentStatus","pulse:continuousIntegrationUrl","pulse:readme","pulse:fundingLink","pulse:developmentDistributionScore","pulse:epssScore"]},{"n":22," /* ------------------------------------------------------------ tooltip */
const tip = $("#tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.classList.add("on");
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 12;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => tip.classList.remove("on");
function bindTip(node, htmlFn) {
  node.addEventListener("pointermove", e => showTip(e, htmlFn()));
  node.addEventListener("pointerleave", hideTip);
}

/* -------------------------------------------------------------- charts */
function barChart(rows, opts) {
  const o = opts || {}, max = Math.max(1, ...rows.map(r => r.v));
  const wrap = el("div", "bars");
  rows.forEach(r => {
    const row = el("div", "bar-row" + (r.go ? " click" : ""));
    row.innerHTML = `<div class="bar-label">${esc(r.k)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(r.v / max * 100).toFixed(1)}%${
        r.color ? ";background:" + r.color : ""}"></div></div>
      <div class="bar-val">${r.v.toLocaleString()}</div>`;
    bindTip(row, () => `<div class="t-h">${esc(r.k)} — ${r.v.toLocaleString()} ${
      esc(o.unit || "")}</div>${r.note ? `<div class="t-d">${esc(r.note)}</div>` : ""}`);
    if (r.go) row.addEventListener("click", r.go);
    wrap.appendChild(row);
  });
  return wrap;
}

    ["all", "proposed", "extended", "upstream"].map(o =>
      `<button class="chip" data-origin="${o}" aria-pressed="${cstate.origin === o}">${
        o === "all" ? "all origins" : esc((ORIGIN[o] || {}).label || o)}</button>`).join("") +
    `<button class="chip" data-dataonly aria-pressed="${cstate.dataOnly}">has real data</button>` +
    `<select class="chip" id="platSel" style="padding:4px 8px">
      <option value="all">any platform</option>${platforms.map(p =>
      `<option value="${esc(p)}"${cstate.platform === p ? " selected" : ""}>${esc(p)}</option>`).join("")}</select>`;
  v.appendChild(f);

  const split = el("div", "split");
  const list = el("div", "list");
  const detail = el("div", "detail");
  split.append(list, detail);
  v.appendChild(split);

  function paint() {
    const keep = c => (cstate.origin === "all" || c.origin === cstate.origin) &&
      (!cstate.dataOnly || c.instances > 0) &&
      (cstate.platform === "all" || c.platforms.indexOf(cstate.platform) >= 0);
    list.innerHTML = "";
    const groups = [["Classes", classes.filter(keep)], ["Enumerations", enumClasses.filter(keep)]];
    let first = null;
    groups.forEach(([name, items]) => {
      if (!items.length) return;
      list.appendChild(el("div", "list-group", `${name} · ${items.length}`));
      items.sort((a, b) => b.instances - a.instances ||
        a.curie.localeCompare(b.curie)).forEach(c => {
        if (!first) first = c.curie;
        const b = el("button");
        b.setAttribute("aria-current", cstate.sel === c.curie);
        b.innerHTML = `${originDot(c.origin)}<span class="li-name">${esc(c.curie)}</span>
          <span class="li-n">${c.instances || (DATA.enums[c.curie] || []).length || ""}</span>`;
        b.addEventListener("click", () => { cstate.sel = c.curie; paint(); });
        list.appendChild(b);
      });
    });
    if (!list.children.length) list.appendChild(el("div", "list-group", "nothing matches"));
    if (!cstate.sel || !T[cstate.sel]) cstate.sel = first || "pulse:Package";
    detail.innerHTML = "";
    detail.appendChild(termCard(cstate.sel));
  }
  f.querySelectorAll("[data-origin]").forEach(b => b.addEventListener("click", () => {
    cstate.origin = b.dataset.origin;
    f.querySelectorAll("[data-origin]").forEach(x =>
      x.setAttribute("aria-pressed", x.dataset.origin === cstate.origin));
    paint();
  }));
  f.querySelector("[data-dataonly]").addEventListener("click", e => {
    cstate.dataOnly = !cstate.dataOnly;
    e.currentTarget.setAttribute("aria-pressed", cstate.dataOnly); paint();
  });
  $("#platSel", f).addEventListener("change", e => { cstate.platform = e.target.value; paint(); });
  cstate.paint = paint;
  paint();
}

/* ---------------------------------------------------------- provenance bits */
const KIND_NOTE = {
  "committed snapshot": "a captured HTTP response committed to the test fixtures",
  "live capture": "fetched by fetch_live_sources.py, then replayed offline",
  "local index": "one of our own DuckDB stores",
  "bulk export": "a dated bulk download, not a request",
  "rete query": "range-read SPARQL against a published .rete graph"
};
// one source list per platform, so a term can name its actual payloads
const srcByPlatform = {};
DATA.sources.forEach((s, i) => (srcByPlatform[s.platform] = srcByPlatform[s.platform] || []).push(i));
const sourcesFor = t => (t.platforms || [])
  .flatMap(p => srcByPlatform[p] || []).map(i => DATA.sources[i]);

function declLinks(list) {
  if (!list || !list.length) return "";
  return `<div class="tags">${list.map(d => {
    const label = d.line ? `${d.file}:${d.line}` : d.file;
    const title = d.note ? ` title="${esc(d.note)}"` : "";
    return d.url
      ? `<a class="tag link" href="${esc(d.url)}" target="_blank" rel="noopener"${title}>${
          esc(label)} ↗</a>`
      : `<span class="tag"${title}>${esc(d.path ? d.path + ":" + d.line : label)}</span>`;
  }).join("")}</div>`;
}

function srcList(srcs) {
  const seen = new Set();
  const rows = srcs.filter(s => { const k = s.kind + s.name;
    if (seen.has(k)) return false; seen.add(k); return true; });
  return `<ul class="srcs">${rows.map(s => `<li>
    <span class="pill">${esc(s.platform)}</span>
    <span class="muted">${esc(s.kind)}</span>
    ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener" class="mono src-url">${
      esc(s.url)}</a>` : `<span class="mono src-url">${esc(s.path || "")}</span>`}
    ${s.capturedAt ? `<span class="muted nowrap">${esc(s.capturedAt)}</span>` : ""}
    ${s.rows != null ? `<span class="muted nowrap">${esc(String(s.rows))} rows</span>` : ""}
    ${s.note ? `<div class="muted" style="font-size:11px">${esc(s.note)}</div>` : ""}
  </li>`).join("")}</ul>`;
}

function constraintsFor(cls, path) {
  for (const s of DATA.shapes) {
    if (s.targetClass !== cls) continue;
    const p = s.properties.find(x => x.path === path);
    if (p) return p;
  }
  return null;
}
function card(cls) { const c = el("div", "card"); c.style.marginBottom = "14px"; return c; }

function termCard(curie) {
  const t = T[curie];
  const box = el("div");
  if (!t) { box.innerHTML = `<p class="muted">Unknown term <code>${esc(curie)}</code>.</p>`; return box; }
  const sec = sectionOf[curie];
  const enumMembers = DATA.enums[curie] || [];
  const shapesFor = DATA.shapes.filter(s => s.targetClass === curie);

  box.innerHTML = `
    <div class="detail-head">
      <h1>${esc(t.label || curie)}</h1>${originPill(t.origin)}
      ${t.instances ? `<span class="pill">${t.instances} instance${t.instances > 1 ? "s" : ""}</span>` : ""}
      ${t.uses ? `<span class="pill">${t.uses} triple${t.uses > 1 ? "s" : ""} of real data</span>` : ""}
      ${!t.instances && !t.uses ? `<span class="pill" title="no real data exercises this term yet">
        ○ not yet exercised</span>` : ""}
    </div>
    <div class="mono iri">${esc(curie)} &nbsp;·&nbsp; ${esc(t.iri)}</div>
    <p class="def">${esc(t.definition) || "<span class='muted'>No definition in the source files.</span>"}</p>
    ${t.note ? `<p class="def muted" style="font-size:12.5px"><b>Note:</b> ${esc(t.note)}</p>` : ""}`;

  const kv = el("dl", "kv");
  const row = (k, html) => { if (!html) return; kv.appendChild(el("dt", null, k));
    kv.appendChild(el("dd", null, html)); };
  const tagList = (arr, link) => arr.length ? `<div class="tags">${arr.map(x =>
    link && T[x] ? `<button class="tag link" data-go="${esc(x)}">${esc(x)}</button>`
      : `<span class="tag">${esc(x)}</span>`).join("")}</div>` : "";

  row("kind", `<span class="mono">${esc(t.kind)}</span>`);
  row("GME field it rescues", tagList(t.mapsFrom));
  row("subclass of", tagList(t.subClassOf, true));
  row("subproperty of", tagList(t.subPropertyOf, true));
  row("equivalent to", tagList(t.equivalent, true));
  row("inverse of", tagList(t.inverseOf, true));
  row("domain", tagList(t.domain, true));
  row("range", tagList(t.range, true));
  row("platforms seen", t.platforms.length ? `<div class="tags">${t.platforms.map(p =>
    `<span class="tag">${esc(p)}</span>`).join("")}</div>` : "<span class='muted'>none yet</span>");
  row("SHACL shape", shapesFor.length ? tagList(shapesFor.map(s => s.name)) :
    `<span class="muted">none — this class has no shape in the profile yet</span>`);
  row("argued in", sec ? `<span class="mono">§${sec.n}</span> ${esc(sec.title)}` : "");
  row("stated in", declLinks(t.declaredIn));
  if (t.emittedBy && t.emittedBy.length)
    row("instances emitted by", `<div class="tags">${t.emittedBy.map(b =>
      `<span class="tag">${esc(b)}</span>`).join("")}</div>`);
  const srcs = sourcesFor(t);
  // platform-level, not triple-level: we know which platforms produced this term
  // and every payload those platforms contributed, but only the Observation layer
  // pins an individual value to an individual request. Said plainly rather than
  // implied away.
  if (srcs.length) row("payloads behind it",
    `<p class="muted" style="margin:0 0 6px;font-size:11.5px">Attribution is
       platform-level: these are every payload the contributing platforms produced.
       Only the <a href="#sources">Observation rows</a> tie one value to one request.</p>` +
    srcList(srcs));
  box.appendChild(kv);

  if (enumMembers.length) {
    const c = card();
    c.innerHTML = `<h3 style="margin-top:0">${enumMembers.length} members</h3>
      <div class="tags">${enumMembers.map(m => `<button class="tag link" data-go="${esc(m)}"
        style="color:${T[m] && T[m].origin === "proposed" ? "var(--ink)" : "var(--ink-2)"}">${
        esc(m.split(":")[1])}${T[m] && T[m].origin === "proposed" ? " +" : ""}</button>`).join("")}</div>
      <p class="muted" style="font-size:11.5px;margin:8px 0 0">A <code>+</code> marks a member we
        propose adding. ${enumMembers.filter(m => T[m] && T[m].origin === "proposed").length} of
        ${enumMembers.length} here.</p>`;
    box.appendChild(c);
  }

  if (t.propsOut && t.propsOut.length) {
    const rows = [...new Set(t.propsOut)].sort().map(p => {
      const pt = T[p] || {curie: p, label: p, origin: "upstream", range: [], uses: 0, platforms: []};
      const con = constraintsFor(curie, p);
      return `<tr>
        <td class="nowrap">${originDot(pt.origin)}
          <button class="tag link" data-go="${esc(p)}">${esc(p)}</button></td>
        <td>${esc((pt.range || []).join(", ") || (con && (con.class || con.datatype)) || "—")}</td>
        <td class="nowrap muted">${con ? esc(`${con.minCount || 0}..${con.maxCount || "*"}`) : "—"}</td>
        <td class="num">${pt.uses || 0}</td>
        <td class="muted" style="font-size:11.5px">${esc((pt.platforms || []).join(" "))}</td></tr>`;
    }).join("");
    const c = el("div", "scrollx");
    c.innerHTML = `<table><thead><tr><th>property</th><th>range / datatype</th>
      <th>card.</th><th class="num">triples</th><th>platforms</th></tr></thead><tbody>${rows}</tbody></table>`;
    const h = el("div"); h.innerHTML = `<h3>${[...new Set(t.propsOut)].length} properties on this class</h3>`;
    h.appendChild(c); box.appendChild(h);
  }

  if (t.propsIn && t.propsIn.length) {
    const c = el("div");
    c.innerHTML = `<h3>Pointed at by</h3><div class="tags">${[...new Set(t.propsIn)].sort()
      .map(p => `<button class="tag link" data-go="${esc(p)}">${esc(p)}</button>`).join("")}</div>`;
    box.appendChild(c);
  }

  shapesFor.forEach(s => {
    const c = el("div");
    c.innerHTML = `<h3>${esc(s.name)}
      <span class="pill" style="text-transform:none;letter-spacing:0">sh:closed ${
        esc(s.closed || "—")}</span></h3>`;
    const sc = el("div", "scrollx");
    sc.innerHTML = `<table><thead><tr><th>path</th><th>class / datatype</th><th>card.</th>
      <th>node kind</th><th>pattern</th></tr></thead><tbody>${s.properties.map(p => `<tr>
        <td class="nowrap mono">${esc(p.path)}</td>
        <td>${esc(p.class || p.datatype || "—")}</td>
        <td class="nowrap muted">${esc(`${p.minCount || 0}..${p.maxCount || "*"}`)}</td>
        <td class="muted">${esc(p.nodeKind.replace("sh:", "") || "—")}</td>
        <td class="mono muted" style="font-size:11px">${esc(p.pattern.slice(0, 40))}</td></tr>`).join("")}
      </tbody></table>`;
    c.appendChild(sc); box.appendChild(c);
  });

  const netBtn = el("button", "chip", "→ show in the network");
  netBtn.style.marginTop = "14px";
  netBtn.addEventListener("click", () => { setView("network"); netFocus(curie); });
  box.appendChild(netBtn);
  return box;
}

    e.currentTarget.setAttribute("aria-pressed", !opts.hidden);

  opts.querySelectorAll("[data-opt]").forEach(r => r.addEventListener("input", () => {
    nstate[r.dataset.opt] = +r.value;
    $(`[data-out="${r.dataset.opt}"]`, opts).textContent = r.value;
    // one rebuild per frame, so dragging a slider stays smooth
    if (pending) return;
    pending = requestAnimationFrame(() => { pending = 0; buildNet(); });
  }));
  f.querySelector("[data-reset]").addEventListener("click", () => {
    nstate.sel = null; view.k = 1; view.x = 0; view.y = 0; buildNet();
  });
  buildNet();
}

const LAYER_OF = {property: "structure", shape: "structure", subclass: "structure",
  observed: "observed", alignment: "alignment", vocabAlignment: "alignment"};
const view = {k: 1, x: 0, y: 0};
let netRoot = null;   // the <g> every rebuild replaces; pan/zoom transforms it
const applyView = () => netRoot && netRoot.setAttribute("transform",
  `translate(${view.x},${view.y}) scale(${view.k})`);
const SVGNS = "http://www.w3.org/2000/svg";
const mk = (t, attrs) => { const n = document.createElementNS(SVGNS, t);
  for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };

function buildNet() {
  const svg = $("#net");
  if (!svg) return;
  const W = svg.clientWidth || 900, H = svg.clientHeight || 600;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";

  const links = DATA.network.links.filter(l => nstate.layers[LAYER_OF[l.kind]]);
  const keep = new Set();
  links.forEach(l => { keep.add(l.source); keep.add(l.target); });
  let nodes = DATA.network.nodes.filter(n => keep.has(n.id) || n.instances > 0);
  const byId = {};
  // deterministic seed layout: a circle, so every render is identical
  nodes = nodes.map((n, i) => {
    // seeded on an ellipse matching the canvas aspect, not a circle: a circular
    // seed in a 2:1 frame settles into a blob that wastes half the width
    const a = i / nodes.length * Math.PI * 2;
    const o = byId[n.id] = Object.assign({}, n, {
      x: W / 2 + Math.cos(a) * W * .34, y: H / 2 + Math.sin(a) * H * .34, vx: 0, vy: 0,
      r: Math.max(5, (7 + Math.sqrt(n.degree || 1) * 3.4) * nstate.nodeScale)
    });
    return o;
  });
  const ls = links.filter(l => byId[l.source] && byId[l.target])
    .map(l => Object.assign({}, l, {s: byId[l.source], t: byId[l.target]}));

  // ---- force layout, settled before the first paint (43 nodes: cheap).
  // Degree also sets how hard a node pushes: hubs need room for their labels,
  // leaves do not. Positions are unclamped here — fitting happens afterwards,
  // so the layout is never squeezed into the viewport it was seeded in.
  const pairIndex = {};
  ls.forEach(l => { const k = [l.source, l.target].sort().join("|");
    l.curve = (pairIndex[k] = (pairIndex[k] || 0) + 1) - 1; });
  const STEPS = 600;
  for (let step = 0; step < STEPS; step++) {
    const alpha = Math.pow(1 - step / STEPS, 1.4);
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = (i - j) || 1; dy = (j - i) * .7 || .7; d2 = dx * dx + dy * dy; }
        const d = Math.sqrt(d2);
        const f = Math.min(60, (14000 + a.r * b.r * 90) / d2 * nstate.repulsion) * (.35 + alpha);
        const ux = dx / d, uy = dy / d;
        a.vx -= ux * f; a.vy -= uy * f; b.vx += ux * f; b.vy += uy * f;
        const minD = a.r + b.r + 26;
        if (d < minD) { const push = (minD - d) * .45;
          a.vx -= ux * push; a.vy -= uy * push; b.vx += ux * push; b.vy += uy * push; }
      }
    }
    ls.forEach(l => {
      const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const target = nstate.spacing * (l.kind === "vocabAlignment" ? 1.4 : 1);
      const f = (d - target) * .06 * (.4 + alpha), ux = dx / d, uy = dy / d;
      l.s.vx += ux * f; l.s.vy += uy * f; l.t.vx -= ux * f; l.t.vy -= uy * f;
    });
    // centering is stronger on the short axis, which flattens the blob into the
    // frame's aspect instead of fighting it
    const ar = W / H;
    nodes.forEach(n => {
      n.vx += (W / 2 - n.x) * .0016 / ar; n.vy += (H / 2 - n.y) * .0016 * ar;
      n.x += (n.vx *= .86); n.y += (n.vy *= .86);
    });
  }

  // ---- fit the settled layout to the canvas, so the graph fills the frame
  // whatever the forces produced and whatever size the container is.
  if (nodes.length) {
    const pad = 46;
    const x0 = Math.min(...nodes.map(n => n.x - n.r)), x1 = Math.max(...nodes.map(n => n.x + n.r));
    const y0 = Math.min(...nodes.map(n => n.y - n.r)), y1 = Math.max(...nodes.map(n => n.y + n.r));
    const sx = (W - pad * 2) / Math.max(1, x1 - x0);
    const sy = (H - pad * 2) / Math.max(1, y1 - y0);
    const s = Math.min(sx, sy, 1.6);
    // a little extra stretch on the roomier axis — capped, so edge lengths stay
    // broadly comparable and the picture is not a funhouse mirror
    const kx = Math.min(1.4, Math.max(1, sx / s)), ky = Math.min(1.4, Math.max(1, sy / s));
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    nodes.forEach(n => {
      n.x = W / 2 + (n.x - cx) * s * kx;
      n.y = H / 2 + (n.y - cy) * s * ky;
      n.r = Math.max(5, n.r * Math.min(1, s * 1.15));
    });
  }

  // ---- board mode: snap every pad to the grid, and never onto an occupied
  // cell. Traces are only legible if their endpoints sit on the same lattice
  // they run along.
  const G = Math.max(8, nstate.grid);
  if (nstate.mode === "pcb") {
    const taken = new Set();
    const key = (gx, gy) => gx + "," + gy;
    nodes.slice().sort((a, b) => b.degree - a.degree).forEach(n => {
      let gx = Math.round(n.x / G), gy = Math.round(n.y / G);
      const need = Math.max(1, Math.ceil((n.r + 6) / G));   // pads reserve a halo
      const free = (x, y) => {
        for (let i = -need; i <= need; i++)
          for (let j = -need; j <= need; j++) if (taken.has(key(x + i, y + j))) return false;
        return true;
      };
      if (!free(gx, gy)) {                     // spiral out to the nearest free cell
        outer: for (let ring = 1; ring < 40; ring++)
          for (let i = -ring; i <= ring; i++)
            for (let j = -ring; j <= ring; j++) {
              if (Math.max(Math.abs(i), Math.abs(j)) !== ring) continue;
              if (free(gx + i, gy + j)) { gx += i; gy += j; break outer; }
            }
      }
      for (let i = -need; i <= need; i++)
        for (let j = -need; j <= need; j++) taken.add(key(gx + i, gy + j));
      n.x = gx * G; n.y = gy * G;
    });
  }

  if (nstate.mode === "pcb") {
    const defs = mk("defs", {});
    const pat = mk("pattern", {id: "boardGrid", width: G, height: G,
      patternUnits: "userSpaceOnUse"});
    pat.appendChild(mk("circle", {cx: .9, cy: .9, r: .9, fill: "var(--axis)",
      "fill-opacity": .7}));
    defs.appendChild(pat);
    svg.appendChild(defs);
    svg.appendChild(mk("rect", {x: -2000, y: -2000, width: 6000, height: 6000,
      fill: "url(#boardGrid)"}));
  }
  const root = mk("g", {});
  svg.appendChild(root);
  const gEdge = mk("g", {}), gNode = mk("g", {}), gLabel = mk("g", {});
  root.append(gEdge, gNode, gLabel);
  netRoot = root;
  applyView();

  // label the hubs by default — 43 labels at once is a wall of text. The rest
  // come in on hover, on selection, or with the "all labels" toggle.
  const degrees = nodes.map(n => n.degree).sort((a, b) => b - a);
  const labelCut = nstate.labelTop <= 0 ? Infinity
    : (degrees[Math.min(nstate.labelTop - 1, degrees.length - 1)] || 1);

  const neigh = new Set();
  if (nstate.sel) { neigh.add(nstate.sel);
    ls.forEach(l => { if (l.source === nstate.sel) neigh.add(l.target);
      if (l.target === nstate.sel) neigh.add(l.source); }); }
  const lit = id => !nstate.sel || neigh.has(id);

  // Board traces: leave the pad on an axis, turn once at 45°, arrive on an axis
  // — the way a router actually draws copper. Parallel traces between the same
  // pair are lane-offset so they read as separate nets.
  function tracePath(l) {
    const lane = ((l.curve % 2 ? 1 : -1) * Math.ceil(l.curve / 2)) * Math.max(4, G * .34);
    const sx = l.s.x, sy = l.s.y, tx = l.t.x + lane, ty = l.t.y + lane;
    const dx = tx - sx, dy = ty - sy;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    const diag = Math.min(ax, ay);
    const sgx = Math.sign(dx) || 1, sgy = Math.sign(dy) || 1;
    // run along the long axis first, then cut the corner at 45°
    return ax >= ay
      ? `M${sx},${sy} H${(sx + sgx * (ax - diag)).toFixed(1)} L${tx.toFixed(1)},${ty.toFixed(1)}`
      : `M${sx},${sy} V${(sy + sgy * (ay - diag)).toFixed(1)} L${tx.toFixed(1)},${ty.toFixed(1)}`;
  }
  function curvePath(l) {
    const mx = (l.s.x + l.t.x) / 2, my = (l.s.y + l.t.y) / 2;
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
    const off = (l.curve % 2 ? 1 : -1) * Math.ceil(l.curve / 2) * 26;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    return `M${l.s.x.toFixed(1)},${l.s.y.toFixed(1)} Q${
      (mx - dy / d * off).toFixed(1)},${(my + dx / d * off).toFixed(1)} ${
      l.t.x.toFixed(1)},${l.t.y.toFixed(1)}`;
  }

  const paths = ls.map(l => {
    const e = EDGE[l.kind];
    const on = lit(l.source) && lit(l.target);
    const pcb = nstate.mode === "pcb";
    const d = pcb ? tracePath(l) : curvePath(l);
    // a surface-coloured halo under each lit trace, so a crossing reads as one
    // trace passing over the other instead of a merged blob
    if (on) gEdge.appendChild(mk("path", {d, fill: "none", stroke: "var(--surface)",
      "stroke-width": e.w + 2.4, "stroke-opacity": .9, "stroke-linejoin": "round"}));
    const p = mk("path", {
      class: "edge" + (l.kind === "observed" ? " observed" : ""), d,
      "stroke-width": e.w, "stroke-opacity": on ? e.op : .06,
      "stroke-dasharray": e.dash || "none",
      "stroke-linecap": pcb ? "butt" : "round",
      "stroke-linejoin": "round"
    });
    p.style.pointerEvents = "stroke";
    p.addEventListener("pointermove", ev => showTip(ev,
      `<div class="t-h">${esc(l.source)} → ${esc(l.target.replace("vocab:", ""))}</div>
       <div class="t-d">${esc(l.via)} · ${esc(EDGE[l.kind].label)}${
        l.count ? ` · ${l.count} triple${l.count > 1 ? "s" : ""}` : ""}</div>`));
    p.addEventListener("pointerleave", hideTip);
    gEdge.appendChild(p);
    return p;
  });

  nodes.forEach(n => {
    const o = ORIGIN[n.origin] || ORIGIN.external;
    const on = lit(n.id);
    const pcb = nstate.mode === "pcb";
    const g = mk("g", {class: "node-hit", opacity: on ? 1 : .18});
    let shape;
    if (n.kind === "vocab") {
      shape = mk("rect", {x: -n.r * .82, y: -n.r * .82, width: n.r * 1.64,
        height: n.r * 1.64, transform: "rotate(45)", rx: pcb ? 1 : 2});
    } else if (pcb) {
      // a pad, not a bubble: square-ish copper with a rounded corner
      shape = mk("rect", {x: -n.r, y: -n.r, width: n.r * 2, height: n.r * 2,
        rx: Math.min(3, n.r * .35)});
    } else if (o.shape === "square") {
      shape = mk("rect", {x: -n.r * .86, y: -n.r * .86, width: n.r * 1.72,
        height: n.r * 1.72, rx: 3});
    } else {
      shape = mk("circle", {r: n.r});
    }
    shape.setAttribute("fill", o.color);
    shape.setAttribute("stroke", "var(--surface)");
    shape.setAttribute("stroke-width", 1.5);
    g.setAttribute("transform", `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
    g.appendChild(shape);
    // the drill hole — only when the pad is big enough to show one
    if (pcb && n.r >= 7) g.appendChild(mk("circle", {r: n.r * .3,
      fill: "var(--surface)", "fill-opacity": .95}));
    if (o.ring) g.appendChild(mk(pcb ? "rect" : "circle", pcb
      ? {x: -n.r - 3, y: -n.r - 3, width: (n.r + 3) * 2, height: (n.r + 3) * 2,
         rx: 2, fill: "none", stroke: o.color, "stroke-width": 1.3, "stroke-opacity": .9}
      : {r: n.r + 3.5, fill: "none", stroke: o.color, "stroke-width": 1.5,
         "stroke-opacity": .9}));
    if (n.instances && n.r >= 7) {
      const b = mk("circle", {r: 5.5, cx: n.r * .95, cy: -n.r * .95, fill: "var(--surface)",
        stroke: "var(--ink-muted)", "stroke-width": 1});
      g.appendChild(b);
      const tx = mk("text", {x: n.r * .95, y: -n.r * .95 + 2.6, "text-anchor": "middle",
        "font-size": 7.5, fill: "var(--ink-2)"});
      tx.textContent = n.instances; g.appendChild(tx);
    }
    g.addEventListener("pointermove", ev => showTip(ev,
      `<div class="t-h">${esc(n.label)} <span class="muted mono">${esc(n.id)}</span></div>
       <div class="t-d">${esc((ORIGIN[n.origin] || {}).label || n.origin)} ·
       ${n.degree} connection${n.degree === 1 ? "" : "s"}${
        n.instances ? ` · ${n.instances} instance${n.instances > 1 ? "s" : ""}` : ""}${
        n.platforms && n.platforms.length ? `<br>${esc(n.platforms.join(", "))}` : ""}</div>`));
    g.addEventListener("pointerleave", hideTip);
    g.addEventListener("click", ev => { ev.stopPropagation();
      nstate.sel = nstate.sel === n.id ? null : n.id; buildNet(); });
    gNode.appendChild(g);

    if (nstate.allLabels || n.degree >= labelCut || n.kind === "vocab" ||
        nstate.sel === n.id || (nstate.sel && neigh.has(n.id))) {
      const label = mk("text", {class: "node-label", x: n.x, y: n.y - n.r - 5,
        "text-anchor": "middle", opacity: on ? 1 : .2});
      label.textContent = n.id.replace("vocab:", "").replace(/^\w+:/, "");
      gLabel.appendChild(label);
    }
  });

  // side panel for the selected node
  const side = $("#netSide");
  if (nstate.sel) {
    const n = byId[nstate.sel], t = T[nstate.sel] || {};
    const rel = ls.filter(l => l.source === nstate.sel || l.target === nstate.sel);
    side.hidden = false;
    side.innerHTML = `<button class="close" aria-label="Close">×</button>
      <h4>${esc(n.label)}</h4>
      <div class="mono muted" style="font-size:11px">${esc(n.id)}</div>
      <div style="margin:7px 0">${originPill(n.origin)}${
        n.instances ? `<span class="pill">${n.instances} instance${n.instances > 1 ? "s" : ""}</span>` : ""}</div>
      ${t.definition ? `<p class="t-d" style="margin:6px 0">${esc(t.definition.slice(0, 200))}${
        t.definition.length > 200 ? "…" : ""}</p>` : ""}
      <ul>${rel.map(l => { const other = l.source === nstate.sel ? l.target : l.source;
        const dir = l.source === nstate.sel ? "→" : "←";
        return `<li>${dir} <b>${esc(other.replace("vocab:", ""))}</b>
          <span class="muted mono" style="font-size:10.5px">${esc(l.via)}</span></li>`; }).join("")}</ul>
      ${T[nstate.sel] ? `<button class="chip" data-go="${esc(nstate.sel)}"
        style="margin-top:9px">open the full term →</button>` : ""}`;
    side.querySelector(".close").addEventListener("click", () => { nstate.sel = null; buildNet(); });
  } else { side.hidden = true; side.innerHTML = ""; }

  // ---- pan / zoom / drag. Bound once: buildNet() re-runs on every click and
  // re-registering here would stack a handler per rebuild.
  if (svg.dataset.bound) return;
  svg.dataset.bound = "1";
  let drag = null;
  svg.addEventListener("pointerdown", e => {
    drag = {x: e.clientX, y: e.clientY, vx: view.x, vy: view.y};
    svg.classList.add("dragging");
  });
  svg.addEventListener("pointermove", e => {
    if (!drag) return;
    view.x = drag.vx + (e.clientX - drag.x); view.y = drag.vy + (e.clientY - drag.y);
    applyView();
  });
  const end = () => { drag = null; svg.classList.remove("dragging"); };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointerleave", end);
  svg.addEventListener("click", e => { if (e.target === svg && nstate.sel) {
    nstate.sel = null; buildNet(); } });
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const k = Math.max(.4, Math.min(3.2, view.k * (e.deltaY < 0 ? 1.12 : .89)));
    const r = svg.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    view.x = mx - (mx - view.x) * (k / view.k);
    view.y = my - (my - view.y) * (k / view.k);
    view.k = k; applyView();
  }, {passive: false});
}
function netFocus(id) {
  nstate.sel = DATA.network.nodes.some(n => n.id === id) ? id : null;
  buildNet();
  if (!nstate.sel) alert(id + " has no class-level connections, so it is not a network node.");
}

  f.innerHTML = ["all", "wired", "index", "test"].map(k =>
    `<button class="chip" data-only="${k}" aria-pressed="${pstate.only === k}">${
      k === "all" ? "every platform" : esc(HOW[k].label)}</button>`).join("");
  v.appendChild(f);
  const host = el("div");
  v.appendChild(host);

  function fieldTags(fields) {
    const seen = new Set();
    return fields.filter(x => x.status !== "housekeeping" &&
      !seen.has(x.name) && seen.add(x.name)).map(x => x.status === "matched"
        ? `<button class="tag link" data-go="${esc(x.term)}"
             title="name matches ${esc(x.term)}"
             style="border-color:var(--c-upstream)">${esc(x.name)}</button>`
        : `<span class="tag" title="no term matched by name">${esc(x.name)}</span>`).join("");
  }

  function paint() {
    f.querySelectorAll("[data-only]").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.only === pstate.only));
    host.innerHTML = "";
    P.filter(p => pstate.only === "all" || p.how === pstate.only)
     .filter(p => !pstate.sel || p.name === pstate.sel)
     .forEach(p => {
      const card = el("div", "card");
      card.style.marginBottom = "12px";
      const t = p.totals;
      card.innerHTML = `<div class="detail-head" style="margin-bottom:6px">
          <h2 style="margin:0;font-size:14px">${esc(p.name)}</h2>
          <span class="pill">${esc(HOW[p.how].label)}</span>
          <span class="pill">${t.distinct} fields</span>
          <span class="pill">${t.matched} share a name with a term</span>
          ${t.rows ? `<span class="pill">${t.rows.toLocaleString()} rows</span>`
            : `<span class="pill">no rows indexed</span>`}</div>
        <div class="mono muted" style="font-size:11px;margin-bottom:8px">${esc(p.where)}</div>`;
      p.indices.forEach(i => {
        const b = el("div");
        b.style.margin = "8px 0";
        b.innerHTML = `<div style="font-size:12px;margin-bottom:4px">
            <span class="mono">${esc(i.index)}.${esc(i.table)}</span>
            <span class="muted">— ${i.rows.toLocaleString()} rows,
            ${esc(i.path)}</span></div>
          <div class="tags">${fieldTags(i.fields)}</div>`;
        card.appendChild(b);
      });
      p.endpoints.forEach(e => {
        const b = el("div");
        b.style.margin = "8px 0";
        b.innerHTML = `<div style="font-size:12px;margin-bottom:4px">
            <span class="muted">${esc(e.kind)}</span>
            ${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener"
              class="mono" style="font-size:11px">${esc(e.url)}</a>`
              : `<span class="mono">${esc(e.case)}</span>`}
            ${e.capturedAt ? `<span class="muted">· ${esc(e.capturedAt)}</span>` : ""}</div>
          <div class="tags">${fieldTags(e.fields)}</div>`;
        card.appendChild(b);
      });
      p.registries.forEach(r => {
        const b = el("div");
        b.style.margin = "8px 0";
        b.innerHTML = `<div style="font-size:12px;margin-bottom:4px"><span class="mono">${
          esc(r.registry.replace(/_/g, " "))}</span></div>
          <div class="tags">${fieldTags(r.fields)}</div>`;
        card.appendChild(b);
      });
      host.appendChild(card);
    });
    if (pstate.sel) {
      const back = el("button", "chip", "← every platform");
      back.addEventListener("click", () => { pstate.sel = null; paint(); });
      host.prepend(back);
    }
  }
  f.querySelectorAll("[data-only]").forEach(b => b.addEventListener("click", () => {
    pstate.only = b.dataset.only; pstate.sel = null; paint();
  }));
  paint();
}

/* ----------------------------------------------------------- sources */
function renderSources() {
  const v = $("#v-sources");
  const kinds = {};
  DATA.sources.forEach(s => kinds[s.kind] = (kinds[s.kind] || 0) + 1);
  const withUrl = DATA.sources.filter(s => s.url).length;
  v.innerHTML = `<h1>Where every value came from</h1>
    <p class="lede">${DATA.sources.length} payloads behind the
      ${M.triplesInstance}-triple instance graph. ${withUrl} carry the exact request
      URL and the moment it was captured; the rest are dated bulk files or local
      indices, and say so. Nothing in this table is asserted by hand — it is read
      from the fixture manifest, the capture sidecars, and the graph's own
      <code>pulse:retrievedFrom</code> values.</p>`;

  const tiles = el("div", "tiles");
  tiles.innerHTML = Object.entries(kinds).map(([k, n]) =>
    `<div class="tile"><div class="v">${n}</div><div class="k">${esc(k)}${n > 1 ? "s" : ""}</div>
      <div class="sub">${esc(KIND_NOTE[k] || "")}</div></div>`).join("");
  v.appendChild(tiles);

  const c = el("div", "card");
  c.style.marginTop = "18px";
  c.innerHTML = "<h3 style='margin-top:0'>Nodes contributed, by platform</h3>";
  c.appendChild(barChart(Object.entries(DATA.instances.byPlatform).map(([k, n]) => ({
    k, v: n, note: (srcByPlatform[k] || []).length + " payload(s) behind it"
  })), {unit: "nodes"}));
  c.appendChild(el("p", "muted", `<span style="font-size:11.5px">ecosyste.ms is missing
    from this chart on purpose: its two payloads contributed properties to the
    repository node rather than nodes of their own, so it has no
    <code>ExtractionOutput</code> to attribute them to — the same gap ask #4
    describes for the platform enumeration.</span>`));
  v.appendChild(c);

  const groups = {};
  DATA.sources.forEach(s => (groups[s.platform] = groups[s.platform] || []).push(s));
  const h = el("div");
  h.innerHTML = "<h2>Every payload</h2>";
  v.appendChild(h);
  Object.entries(groups).sort((a, b) => a[0].localeCompare(b[0])).forEach(([plat, list]) => {
    const card = el("div", "card");
    card.style.marginBottom = "12px";
    const nodes = DATA.instances.byPlatform[plat];
    card.innerHTML = `<div class="detail-head" style="margin-bottom:8px">
        <h2 style="margin:0;font-size:14px">${esc(plat)}</h2>
        <span class="pill">${list.length} payload${list.length > 1 ? "s" : ""}</span>
        ${nodes ? `<span class="pill">${nodes} nodes in the graph</span>`
          : `<span class="pill">no ExtractionOutput of its own</span>`}
        ${list[0].builder ? `<span class="pill mono" style="font-size:10.5px">${
          esc(list[0].builder)}</span>` : ""}</div>`;
    const sc = el("div", "scrollx");
    sc.innerHTML = `<table><thead><tr><th>kind</th><th>request URL or path</th>
      <th>captured</th><th class="num">rows</th><th>payload on disk</th></tr></thead><tbody>${
      list.map(s => `<tr>
        <td class="nowrap muted">${esc(s.kind)}</td>
        <td>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener"
            class="mono" style="font-size:11.5px">${esc(s.url)}</a>`
          : `<span class="mono muted" style="font-size:11.5px">${esc(s.path || "—")}</span>`}
          ${s.note ? `<div class="muted" style="font-size:11px">${esc(s.note)}</div>` : ""}</td>
        <td class="nowrap muted" style="font-size:11.5px">${esc(s.capturedAt || "—")}</td>
        <td class="num">${s.rows != null ? esc(String(s.rows)) : ""}</td>
        <td class="mono muted" style="font-size:11px">${esc(s.url ? (s.path || "") : "")}</td>
      </tr>`).join("")}</tbody></table>`;
    card.appendChild(sc);
    v.appendChild(card);
  });

  const obs = el("div");
  obs.innerHTML = `<h2>The provenance layer, value by value</h2>
    <p class="lede" style="margin-bottom:12px">${DATA.observations.length}
      <code>pulse:Observation</code> nodes — §18(4)'s non-RDF-star encoding. Each one
      records a single claimed value, the URL it was read from and when. This is the
      part of the model that survives two sources disagreeing.</p>`;
  const osc = el("div", "scrollx");
  osc.innerHTML = `<table><thead><tr><th>subject</th><th>property</th><th>value</th>
    <th>retrieved from</th><th>at</th><th>platform</th><th>kind</th></tr></thead><tbody>${
    DATA.observations.map(o => `<tr>
      <td class="mono" style="font-size:11px;max-width:210px;overflow-wrap:anywhere">${
        esc(o.subject)}</td>
      <td class="nowrap">${T[o.property] ? `<button class="tag link" data-go="${
        esc(o.property)}">${esc(o.property)}</button>` : esc(o.property)}</td>
      <td style="max-width:190px;overflow-wrap:anywhere">${esc(o.value)}</td>
      <td style="max-width:230px;overflow-wrap:anywhere"><a href="${esc(o.url)}"
        target="_blank" rel="noopener" class="mono" style="font-size:11px">${esc(o.url)}</a></td>
      <td class="nowrap muted" style="font-size:11px">${esc(o.at.slice(0, 19))}</td>
      <td class="nowrap">${esc(o.platform)}</td>
      <td class="nowrap muted">${esc(o.obsKind)}</td></tr>`).join("")}</tbody></table>`;
  obs.appendChild(osc);
  v.appendChild(obs);
}

/* --------------------------------------------------------- all terms */
const tstate = {sort: "curie", dir: 1, q: "", kind: "all"};
function renderTerms() {
  const v = $("#v-terms");
  v.innerHTML = `<h1>All ${all.length} terms</h1>
    <p class="lede">The table view: everything at once, sortable. <code>triples</code> counts
      how often real data actually used the term — a zero there is a term no platform we read
      has exercised yet.</p>`;
  const f = el("div", "filters");
  f.innerHTML = ["all", "class", "property", "member"].map(k =>
    `<button class="chip" data-kind="${k}" aria-pressed="${tstate.kind === k}">${
      k === "all" ? "everything" : k + "es"}</button>`).join("") +
    `<input class="chip" id="tq" placeholder="filter…" style="padding:4px 10px" value="${esc(tstate.q)}">`;
  v.appendChild(f);
  const sc = el("div", "scrollx");
  v.appendChild(sc);

  function paint() {
    const q = tstate.q.toLowerCase();
    const rows = all.filter(t => (tstate.kind === "all" || t.kind === tstate.kind) &&
      (!q || (t.curie + " " + t.label + " " + t.definition + " " + t.mapsFrom.join(" "))
        .toLowerCase().includes(q)))
      .sort((a, b) => {
        const k = tstate.sort;
        const av = k === "uses" || k === "instances" ? a[k] : String(a[k] || "");
        const bv = k === "uses" || k === "instances" ? b[k] : String(b[k] || "");
        return (av > bv ? 1 : av < bv ? -1 : 0) * tstate.dir;
      });
    const cols = [["curie", "term"], ["kind", "kind"], ["origin", "origin"],
      ["label", "label"], ["uses", "triples"], ["instances", "instances"]];
    sc.innerHTML = `<table><thead><tr>${cols.map(([k, l]) =>
      `<th class="sortable${k === "uses" || k === "instances" ? " num" : ""}" data-sort="${k}">${l}${
        tstate.sort === k ? (tstate.dir > 0 ? " ↑" : " ↓") : ""}</th>`).join("")}
      <th>stated in</th><th>GME field</th><th>platforms</th></tr></thead><tbody>${rows.map(t => `<tr>
        <td class="nowrap"><button class="tag link" data-go="${esc(t.curie)}">${esc(t.curie)}</button></td>
        <td class="muted">${esc(t.kind)}</td>
        <td class="nowrap">${originDot(t.origin)} <span class="muted" style="font-size:11.5px">${
          esc(t.origin)}</span></td>
        <td>${esc(t.label)}</td>
        <td class="num">${t.uses || ""}</td>
        <td class="num">${t.instances || ""}</td>
        <td class="nowrap" style="font-size:11px">${(t.declaredIn || []).slice(0, 1).map(dc =>
          dc.url ? `<a href="${esc(dc.url)}" target="_blank" rel="noopener" class="mono">${
            esc(dc.line ? dc.file + ":" + dc.line : dc.file)}</a>`
            : `<span class="mono muted">${esc(dc.file)}:${dc.line}</span>`).join("")}</td>
        <td class="mono muted" style="font-size:11px">${esc(t.mapsFrom.join(" "))}</td>
        <td class="muted" style="font-size:11px">${esc(t.platforms.join(" "))}</td></tr>`).join("")}
      </tbody></table>`;
    sc.querySelectorAll("[data-sort]").forEach(th => th.addEventListener("click", () => {
      const k = th.dataset.sort;
      tstate.dir = tstate.sort === k ? -tstate.dir : (k === "uses" || k === "instances" ? -1 : 1);
      tstate.sort = k; paint();
    }));
  }
  f.querySelectorAll("[data-kind]").forEach(b => b.addEventListener("click", () => {
    tstate.kind = b.dataset.kind;
    f.querySelectorAll("[data-kind]").forEach(x =>
      x.setAttribute("aria-pressed", x.dataset.kind === tstate.kind));
    paint();
  }));
  $("#tq", f).addEventListener("input", e => { tstate.q = e.target.value; paint(); });
  paint();
}

/* ---------------------------------------------------------- navigation */
const VIEWS = [
  {id: "overview", label: "Overview", n: () => DATA.sections.length + " sections", render: renderOverview},
  {id: "classes", label: "Classes", n: () => classes.length, render: renderClasses},
  {id: "network", label: "Network", n: () => DATA.network.links.length + " edges", render: renderNetwork},
  {id: "shapes", label: "Shapes", n: () => DATA.shapes.length, render: renderShapes},
  {id: "align", label: "Alignment", n: () => DATA.alignments.length, render: renderAlign},
  {id: "enums", label: "Enumerations", n: () => members.length, render: renderEnums},
  {id: "platforms", label: "Platforms", n: () =>
    (DATA.platformFields.platforms || []).length, render: renderPlatforms},
  {id: "sources", label: "Sources", n: () => DATA.sources.length, render: renderSources},
  {id: "terms", label: "All terms", n: () => all.length, render: renderTerms}
];
const painted = {};
function setView(id, skipHash) {
  const v = VIEWS.find(x => x.id === id) || VIEWS[0];
  VIEWS.forEach(x => { $("#v-" + x.id).hidden = x.id !== v.id; });
  $("#nav").querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-current", b.dataset.view === v.id));
  if (!painted[v.id]) { v.render(); painted[v.id] = true; }
  if (v.id === "network") requestAnimationFrame(buildNet);
  if (!skipHash) location.hash = "#" + v.id + (v.id === "classes" && cstate.sel ?
    "/" + cstate.sel : "");
  scrollTo({top: 0});
}
function goTerm(curie) {
  const t = T[curie];
  if (!t) return;
  if (t.kind === "member") {
    setView("enums");
    return;
  }
  if (t.kind === "class") { cstate.sel = curie; cstate.origin = "all"; cstate.dataOnly = false;
    setView("classes"); if (cstate.paint) cstate.paint(); return; }
  // a property: show it in the detail panel of the classes view
  cstate.sel = curie; setView("classes");
  const d = $("#v-classes .detail");
  if (d) { d.innerHTML = ""; d.appendChild(termCard(curie)); }
  location.hash = "#classes/" + curie;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b) { e.preventDefault(); goTerm(b.dataset.go); }
});

/* -------------------------------------------------------------- search */
const index = all.map(t => ({t, hay: (t.curie + " " + t.label + " " + t.definition + " " +
  t.mapsFrom.join(" ")).toLowerCase()}));
const qEl = $("#q"), resEl = $("#results");
let sel = 0, hits = [];
function runSearch() {
  const q = qEl.value.trim().toLowerCase();
  if (!q) { resEl.classList.remove("open"); return; }
  hits = index.filter(x => x.hay.includes(q))
    .sort((a, b) => a.t.curie.toLowerCase().indexOf(q) - b.t.curie.toLowerCase().indexOf(q) ||
      a.t.curie.length - b.t.curie.length).slice(0, 24);
  sel = 0;
  resEl.innerHTML = hits.length ? hits.map((h, i) => `<button data-i="${i}" class="${
    i === 0 ? "sel" : ""}">${originDot(h.t.origin)} <b>${esc(h.t.curie)}</b>
    <span class="muted" style="font-size:11.5px">${esc(h.t.kind)}</span>
    <span class="r-def">${esc((h.t.definition || h.t.label).slice(0, 110))}</span></button>`).join("")
    : `<div style="padding:9px 11px" class="muted">nothing matches “${esc(q)}”</div>`;
  resEl.classList.add("open");
  resEl.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    goTerm(hits[+b.dataset.i].t.curie); resEl.classList.remove("open"); qEl.blur();
  }));
}
qEl.addEventListener("input", runSearch);
qEl.addEventListener("focus", runSearch);
qEl.addEventListener("keydown", e => {
  if (e.key === "Escape") { resEl.classList.remove("open"); qEl.blur(); return; }
  if (!hits.length) return;
  if (e.key === "Enter") { goTerm(hits[sel].t.curie); resEl.classList.remove("open"); qEl.blur(); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    sel = (sel + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length;
    resEl.querySelectorAll("button").forEach((b, i) => b.classList.toggle("sel", i === sel));
    const cur = resEl.querySelector("button.sel");
    if (cur) cur.scrollIntoView({block: "nearest"});
  }
});
document.addEventListener("click", e => {
  if (!e.target.closest(".search")) resEl.classList.remove("open");
});
document.addEventListener("keydown", e => {
  if ((e.key === "/" || (e.key === "k" && (e.metaKey || e.ctrlKey))) &&
      document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); qEl.select(); }
});

/* ---------------------------------------------------------------- boot */
$("#brandSub").innerHTML = `${esc(M.upstreamRepo)}<br>${esc(M.upstreamBranch)}<br>
  <span class="mono">@${esc(M.upstreamRef)}</span> · GME ${esc(M.gmeVersion)}`;
$("#sideFoot").innerHTML = `Generated from the Turtle in <code>dev/v4.0.0/</code> by
  <code>build_explorer.py</code>. Upstream is CC-BY-SA-4.0.<br><br>
  ${M.triplesUpstream} upstream + ${M.triplesProposed} proposed triples ·
  ${M.triplesShapes} in shapes · ${M.triplesInstance} of real instance data.<br><br>
  Press <b>/</b> to search.`;
$("#nav").innerHTML = VIEWS.map(v =>
  `<button data-view="${v.id}"><span>${v.label}</span><span class="n">${v.n()}</span></button>`).join("");
$("#nav").querySelectorAll("button").forEach(b =>
  b.addEventListener("click", () => setView(b.dataset.view)));
$("#themeBtn").addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.getAttribute("data-theme") || (dark ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  if (painted.network) buildNet();
});
addEventListener("resize", () => { if (painted.network && !$("#v-network").hidden) buildNet(); });
function fromHash() {
  const [id, term] = location.hash.replace(/^#/, "").split("/");
  if (term && T[decodeURIComponent(term)]) { goTerm(decodeURIComponent(term)); return; }
  setView(id || "overview", true);
}
addEventListener("hashchange", fromHash);
fromHash();
})();
</script>
</body>
</html>
