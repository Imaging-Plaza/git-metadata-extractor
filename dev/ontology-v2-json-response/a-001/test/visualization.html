<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Pulse Ontology - JSON-LD Graph Visualization</title>

    <!-- Sigma.js and Graphology from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/graphology@0.25.4/dist/graphology.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sigma@2.4.0/build/sigma.min.js"></script>
    <!-- ForceAtlas2 layout - use specific bundle that exposes global -->
    <script src="https://cdn.jsdelivr.net/npm/graphology-layout-forceatlas2@0.10.1/build/graphology-layout-forceatlas2.umd.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #main-content {
            display: flex;
            flex: 1;
            min-height: 0;
            min-width: 0;
            position: relative;
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 320px;
            min-width: 320px;
            background: white;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width 0.3s ease, min-width 0.3s ease;
            flex-shrink: 0;
        }

        #sidebar.collapsed {
            width: 0;
            min-width: 0;
            border-right: none;
        }

        #sidebar.collapsed > * {
            display: none;
        }

        /* Sidebar toggle wrapper to position button correctly */
        #sidebar-wrapper {
            position: relative;
            display: flex;
        }

        #sidebar-toggle {
            position: absolute;
            left: 320px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 50px;
            background: white;
            border: 1px solid #e2e8f0;
            border-left: none;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #64748b;
            z-index: 100;
            transition: left 0.3s ease, background-color 0.2s;
            box-shadow: 2px 0 4px rgba(0,0,0,0.05);
        }

        #sidebar-toggle:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        #sidebar-toggle.sidebar-collapsed {
            left: 0;
        }

        #sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        #sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 4px;
        }

        #sidebar-header p {
            font-size: 12px;
            color: #64748b;
        }

        /* Search */
        #search-container {
            padding: 16px 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        #search-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        #search-input:focus {
            border-color: #3b82f6;
        }

        #search-results {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 8px;
        }

        .search-result {
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-result:hover {
            background: #f1f5f9;
        }

        .search-result-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Collapsible sidebar sections */
        .sidebar-section {
            border-bottom: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .sidebar-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            cursor: pointer;
            user-select: none;
            background: #f8fafc;
            transition: background 0.2s;
        }

        .sidebar-section-header:hover {
            background: #f1f5f9;
        }

        .sidebar-section-header h3 {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0;
        }

        .sidebar-section-toggle {
            font-size: 12px;
            color: #94a3b8;
            transition: transform 0.2s;
        }

        .sidebar-section.collapsed .sidebar-section-toggle {
            transform: rotate(-90deg);
        }

        .sidebar-section-content {
            padding: 12px 20px;
            transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.2s ease;
            max-height: 500px;
            opacity: 1;
        }

        .sidebar-section.collapsed .sidebar-section-content {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            opacity: 0;
        }

        /* Resize handle between sections */
        .sidebar-resize-handle {
            height: 6px;
            background: transparent;
            cursor: ns-resize;
            position: relative;
            border-bottom: 1px solid #e2e8f0;
        }

        .sidebar-resize-handle:hover {
            background: #e2e8f0;
        }

        .sidebar-resize-handle::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 3px;
            border-radius: 2px;
            background: #cbd5e1;
        }

        /* Filters */
        #filters-container {
        }

        #filters-container h3 {}

        .filter-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            cursor: pointer;
        }

        .filter-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .filter-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .filter-label {
            font-size: 14px;
            flex: 1;
        }

        .filter-count {
            font-size: 12px;
            color: #94a3b8;
        }

        /* Legend */
        #legend-container {
        }

        #legend-container h3 {}

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 13px;
        }

        .legend-line {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }

        /* Node details */
        #details-container {
            flex: 1;
            overflow-y: auto;
        }

        #details-container h3 {}

        #details-placeholder {
            color: #94a3b8;
            font-size: 13px;
            font-style: italic;
        }

        #node-details {
            display: none;
        }

        #node-details.active {
            display: block;
        }

        #node-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            word-break: break-word;
        }

        #node-type {
            display: inline-block;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .property-item {
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .property-key {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 2px;
        }

        .property-value {
            font-size: 13px;
            word-break: break-word;
        }

        .property-value a {
            color: #3b82f6;
            text-decoration: none;
        }

        .property-value a:hover {
            text-decoration: underline;
        }

        /* Graph container */
        #graph-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
        }

        #graph-container {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        #sigma-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f8fafc;
        }

        /* Controls */
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #64748b;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: #f1f5f9;
            color: #1e293b;
        }

        .control-btn.active {
            background: #dbeafe;
            color: #3b82f6;
            border-color: #3b82f6;
        }

        /* Layout selector */
        #layout-selector {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 4px;
            z-index: 100;
        }

        .layout-btn {
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 500;
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #64748b;
            transition: all 0.2s;
        }

        .layout-btn:hover {
            background: #f1f5f9;
            color: #1e293b;
        }

        .layout-btn.active {
            background: #3b82f6;
            color: white;
        }

        /* Drag indicator */
        #drag-hint {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #drag-hint.visible {
            opacity: 1;
        }

        /* Stats */
        #stats {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 12px;
            color: #64748b;
        }

        #stats span {
            color: #1e293b;
            font-weight: 600;
        }

        /* Tooltip */
        #tooltip {
            position: absolute;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            pointer-events: none;
            display: none;
            max-width: 350px;
            z-index: 1000;
        }

        #tooltip.visible {
            display: block;
        }

        #tooltip-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        #tooltip-type {
            display: inline-block;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        #tooltip-edge {
            font-size: 12px;
            color: #64748b;
        }

        #tooltip-properties {
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid #e2e8f0;
            padding-top: 8px;
            margin-top: 8px;
        }

        .tooltip-prop {
            padding: 3px 0;
            display: flex;
            gap: 8px;
        }

        .tooltip-prop-key {
            color: #64748b;
            font-weight: 500;
            min-width: 80px;
            flex-shrink: 0;
        }

        .tooltip-prop-value {
            color: #1e293b;
            word-break: break-word;
        }

        /* Data Panel (Bottom) - inside graph area */
        #data-panel {
            background: white;
            border-top: 1px solid #e2e8f0;
            transition: max-height 0.3s ease;
            max-height: 280px;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
            z-index: 50;
        }

        #data-panel.collapsed {
            max-height: 36px;
        }

        #data-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
        }

        #data-panel-header h3 {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #data-panel-toggle {
            font-size: 18px;
            color: #64748b;
            transition: transform 0.3s;
        }

        #data-panel.collapsed #data-panel-toggle {
            transform: rotate(180deg);
        }

        #data-panel-tabs {
            display: flex;
            gap: 0;
            padding: 0 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            overflow-x: auto;
        }

        .data-tab {
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .data-tab:hover {
            color: #1e293b;
        }

        .data-tab.active {
            color: #3b82f6;
            border-bottom-color: #3b82f6;
        }

        .data-tab-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .data-tab-count {
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
        }

        #data-panel-content {
            height: 200px;
            padding: 0;
            overflow: hidden;
            position: relative;
        }

        .data-table-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: auto;
        }

        .data-table {
            border-collapse: collapse;
            font-size: 12px;
        }

        .data-table th {
            position: sticky;
            top: 0;
            background: #f8fafc;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        .data-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #f1f5f9;
            white-space: nowrap;
        }

        .data-table tr {
            cursor: pointer;
        }

        .data-table tr:hover {
            background: #f1f5f9;
        }

        .data-table tr.selected {
            background: #dbeafe;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="main-content">
            <div id="sidebar-wrapper">
                <div id="sidebar">
                    <div id="sidebar-header">
                        <h1>Open Pulse Ontology</h1>
                        <p>JSON-LD Graph Visualization</p>
                    </div>

                <div id="search-container">
                    <input type="text" id="search-input" placeholder="Search nodes...">
                    <div id="search-results"></div>
                </div>

                <div class="sidebar-section" id="filters-section">
                    <div class="sidebar-section-header">
                        <h3>Entity Types</h3>
                        <span class="sidebar-section-toggle">▼</span>
                    </div>
                    <div class="sidebar-section-content">
                        <div id="filters"></div>
                    </div>
                </div>

                <div class="sidebar-section" id="legend-section">
                    <div class="sidebar-section-header">
                        <h3>Relationships</h3>
                        <span class="sidebar-section-toggle">▼</span>
                    </div>
                    <div class="sidebar-section-content">
                        <div id="edge-legend"></div>
                    </div>
                </div>

                <div class="sidebar-section" id="details-section">
                    <div class="sidebar-section-header">
                        <h3>Node Details</h3>
                        <span class="sidebar-section-toggle">▼</span>
                    </div>
                    <div class="sidebar-section-content" id="details-container">
                        <p id="details-placeholder">Click a node to see details</p>
                        <div id="node-details">
                            <div id="node-title"></div>
                            <span id="node-type"></span>
                            <div id="node-properties"></div>
                        </div>
                    </div>
                </div>
            </div>
            <button id="sidebar-toggle" title="Toggle Sidebar">◀</button>
            </div>

            <div id="graph-area">
                <div id="graph-container">
                    <div id="sigma-container"></div>

                    <!-- Layout selector -->
                    <div id="layout-selector">
                        <button class="layout-btn active" data-layout="force" title="Force-directed layout with animation">Force Atlas</button>
                        <button class="layout-btn" data-layout="circular" title="Arrange nodes in a circle by type">Circular</button>
                        <button class="layout-btn" data-layout="radial" title="Hierarchical rings by entity type">Radial</button>
                        <button class="layout-btn" data-layout="grid" title="Arrange nodes in a grid">Grid</button>
                    </div>

                    <div id="controls">
                        <button class="control-btn" id="zoom-in" title="Zoom In">+</button>
                        <button class="control-btn" id="zoom-out" title="Zoom Out">−</button>
                        <button class="control-btn" id="zoom-fit" title="Fit to View">⊡</button>
                        <button class="control-btn" id="reset-view" title="Reset">↺</button>
                        <button class="control-btn" id="toggle-drag" title="Toggle Drag Mode">✋</button>
                        <button class="control-btn active" id="toggle-tooltip" title="Toggle Tooltips">💬</button>
                        <button class="control-btn" id="stop-layout" title="Stop Animation" style="display:none;">⏹</button>
                    </div>

                    <div id="drag-hint">Drag mode: Click and drag nodes to reposition them</div>

                    <div id="stats">
                        <span id="node-count">0</span> nodes · <span id="edge-count">0</span> edges
                    </div>

                    <div id="tooltip">
                        <div id="tooltip-title"></div>
                        <div id="tooltip-type"></div>
                        <div id="tooltip-edge"></div>
                        <div id="tooltip-properties"></div>
                    </div>
                </div>

                <!-- Data Panel inside graph area -->
                <div id="data-panel" class="collapsed">
                    <div id="data-panel-header">
                        <h3>📊 Data Tables</h3>
                        <span id="data-panel-toggle">▼</span>
                    </div>
                    <div id="data-panel-tabs"></div>
                    <div id="data-panel-content"></div>
                </div>
            </div>
        </div>
    </div>

                    for (let i = 0; i < nodes.length; i++) {

                            const dx = nodes[j].x - nodes[i].x;
                            const dy = nodes[j].y - nodes[i].y;
                            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                            const force = repulsion / (dist * dist);

                            const fx = (dx / dist) * force;
                            const fy = (dy / dist) * force;

                            nodes[i].vx -= fx;
                            nodes[i].vy -= fy;
                            nodes[j].vx += fx;
                            nodes[j].vy += fy;
                        }
                    }

                    // Attraction along edges
                    edges.forEach(edge => {
                        const source = nodes[edge.source];
                        const target = nodes[edge.target];
                        const dx = target.x - source.x;
                        const dy = target.y - source.y;
                        const dist = Math.sqrt(dx * dx + dy * dy) || 1;

                        const force = dist * attraction;
                        const fx = (dx / dist) * force;
                        const fy = (dy / dist) * force;

                        source.vx += fx;
                        source.vy += fy;
                        target.vx -= fx;
                        target.vy -= fy;
                    });

                    // Gravity towards center
                    nodes.forEach(node => {
                        node.vx -= node.x * gravity * 0.01;
                        node.vy -= node.y * gravity * 0.01;
                    });

                    // Update positions
                    nodes.forEach(node => {
                        node.x += node.vx;
                        node.y += node.vy;
                    });
                }

                // Animate the layout
                function animateForce() {
                    // Run multiple iterations per frame for speed
                    const iterationsPerFrame = 3;
                    for (let i = 0; i < iterationsPerFrame && forceIterations < maxIterations; i++) {
                        simulateStep();
                        forceIterations++;
                    }

                    // Update graph positions
                    nodes.forEach(node => {
                        graph.setNodeAttribute(node.id, 'x', node.x);
                        graph.setNodeAttribute(node.id, 'y', node.y);
                    });

                    sigma.refresh();

                    // Continue if not done
                    if (forceIterations < maxIterations && layoutRunning) {
                        forceAnimationId = requestAnimationFrame(animateForce);
                    } else {
                        stopLayoutBtn.style.display = 'none';
                        layoutRunning = false;
                        console.log('Force layout complete after', forceIterations, 'iterations');
                    }
                }

                // Start animation
                forceAnimationId = requestAnimationFrame(animateForce);
            },

            circular: function() {
                stopForceAnimation();
                // Group nodes by type and arrange in circles
                const nodesByType = {};
                graph.forEachNode((nodeId, attrs) => {
                    const type = attrs.nodeType;
                    if (!nodesByType[type]) nodesByType[type] = [];
                    nodesByType[type].push(nodeId);
                });

                const typeOrder = ['Organization', 'Person', 'Repository', 'Article', 'Membership', 'Contribution'];
                const sortedTypes = Object.keys(nodesByType).sort((a, b) => {
                    const aIdx = typeOrder.indexOf(a);
                    const bIdx = typeOrder.indexOf(b);
                    return (aIdx === -1 ? 999 : aIdx) - (bIdx === -1 ? 999 : bIdx);
                });

                let currentAngle = 0;
                const totalNodes = graph.order;
                const radius = Math.max(200, totalNodes * 15);

                sortedTypes.forEach(type => {
                    const nodes = nodesByType[type];
                    const anglePerNode = (2 * Math.PI) / totalNodes;

                    nodes.forEach(nodeId => {
                        const x = radius * Math.cos(currentAngle);
                        const y = radius * Math.sin(currentAngle);
                        graph.setNodeAttribute(nodeId, 'x', x);
                        graph.setNodeAttribute(nodeId, 'y', y);
                        currentAngle += anglePerNode;
                    });
                });
            },

            radial: function() {
                stopForceAnimation();
                // Hierarchical rings by entity type
                const nodesByType = {};
                graph.forEachNode((nodeId, attrs) => {
                    const type = attrs.nodeType;
                    if (!nodesByType[type]) nodesByType[type] = [];
                    nodesByType[type].push(nodeId);
                });

                const ringConfig = {
                    'Organization': { ring: 0, radius: 0 },
                    'Person': { ring: 1, radius: 200 },
                    'Repository': { ring: 2, radius: 350 },
                    'Article': { ring: 2, radius: 400 },
                    'Membership': { ring: 3, radius: 500 },
                    'Contribution': { ring: 3, radius: 550 },
                };

                Object.entries(nodesByType).forEach(([type, nodes]) => {
                    const config = ringConfig[type] || { ring: 3, radius: 450 };
                    const count = nodes.length;

                    if (config.radius === 0 && count > 0) {
                        // Center nodes in a small cluster
                        const clusterRadius = count > 1 ? 50 : 0;
                        nodes.forEach((nodeId, i) => {
                            const angle = (2 * Math.PI * i / count);
                            graph.setNodeAttribute(nodeId, 'x', clusterRadius * Math.cos(angle));
                            graph.setNodeAttribute(nodeId, 'y', clusterRadius * Math.sin(angle));
                        });
                    } else {
                        nodes.forEach((nodeId, i) => {
                            const angle = (2 * Math.PI * i / count) - Math.PI / 2;
                            const jitter = (Math.random() - 0.5) * 30;
                            graph.setNodeAttribute(nodeId, 'x', (config.radius + jitter) * Math.cos(angle));
                            graph.setNodeAttribute(nodeId, 'y', (config.radius + jitter) * Math.sin(angle));
                        });
                    }
                });
            },

            grid: function() {
                stopForceAnimation();
                const nodes = [];
                graph.forEachNode((nodeId) => nodes.push(nodeId));

                // Sort by type then label
                nodes.sort((a, b) => {
                    const typeA = graph.getNodeAttribute(a, 'nodeType');
                    const typeB = graph.getNodeAttribute(b, 'nodeType');
                    if (typeA !== typeB) return typeA.localeCompare(typeB);
                    const labelA = graph.getNodeAttribute(a, 'label');
                    const labelB = graph.getNodeAttribute(b, 'label');
                    return labelA.localeCompare(labelB);
                });

                const cols = Math.ceil(Math.sqrt(nodes.length));
                const spacing = 150;

                nodes.forEach((nodeId, i) => {
                    const col = i % cols;
                    const row = Math.floor(i / cols);
                    graph.setNodeAttribute(nodeId, 'x', col * spacing - (cols * spacing) / 2);
                    graph.setNodeAttribute(nodeId, 'y', row * spacing - (Math.ceil(nodes.length / cols) * spacing) / 2);
                });
            }
        };

        // Highlight node and its connections (for hover)
        // When a node is selected, this adds the hovered node's connections to the highlight
        function highlightNodeConnections(nodeId, combineWithSelection = false) {
            const hoverNodes = new Set();
            const hoverEdges = new Set();

            hoverNodes.add(nodeId);

            // Find connected nodes for hovered node
            graph.forEachEdge(nodeId, (edgeId, attrs, source, target) => {
                hoverEdges.add(edgeId);
                hoverNodes.add(source);
                hoverNodes.add(target);
            });

            // Combine with selected node's connections if needed
            const combinedNodes = new Set([...hoverNodes]);
            const combinedEdges = new Set([...hoverEdges]);

            if (combineWithSelection && selectedNode) {
                combinedNodes.add(selectedNode);
                graph.forEachEdge(selectedNode, (edgeId, attrs, source, target) => {
                    combinedEdges.add(edgeId);
                    combinedNodes.add(source);
                    combinedNodes.add(target);
                });
            }

            // Update node colors
            graph.forEachNode((id, attrs) => {
                if (combinedNodes.has(id)) {
                    graph.setNodeAttribute(id, "color", attrs.originalColor);
                    graph.setNodeAttribute(id, "zIndex", 1);
                } else {
                    graph.setNodeAttribute(id, "color", "#d1d5db");
                    graph.setNodeAttribute(id, "zIndex", 0);
                }
            });

            // Update edge colors
            graph.forEachEdge((id, attrs) => {
                if (combinedEdges.has(id)) {
                    graph.setEdgeAttribute(id, "color", attrs.originalColor);
                    graph.setEdgeAttribute(id, "size", 3);
                    graph.setEdgeAttribute(id, "zIndex", 1);
                } else {
                    graph.setEdgeAttribute(id, "color", "#e5e7eb");
                    graph.setEdgeAttribute(id, "size", 1);
                    graph.setEdgeAttribute(id, "zIndex", 0);
                }
            });

            sigma.refresh();
        }

        // Restore selection highlight (when leaving a hovered node while one is selected)
        function restoreSelectionHighlight() {
            if (!selectedNode) return;

            highlightedNodes.clear();
            highlightedEdges.clear();
            highlightedNodes.add(selectedNode);

            graph.forEachEdge(selectedNode, (edgeId, attrs, source, target) => {
                highlightedEdges.add(edgeId);
                highlightedNodes.add(source);
                highlightedNodes.add(target);
            });

            graph.forEachNode((id, attrs) => {
                if (highlightedNodes.has(id)) {
                    graph.setNodeAttribute(id, "color", attrs.originalColor);
                    graph.setNodeAttribute(id, "zIndex", 1);
                } else {
                    graph.setNodeAttribute(id, "color", "#d1d5db");
                    graph.setNodeAttribute(id, "zIndex", 0);
                }
            });

            graph.forEachEdge((id, attrs) => {
                if (highlightedEdges.has(id)) {
                    graph.setEdgeAttribute(id, "color", attrs.originalColor);
                    graph.setEdgeAttribute(id, "size", 3);
                    graph.setEdgeAttribute(id, "zIndex", 1);
                } else {
                    graph.setEdgeAttribute(id, "color", "#e5e7eb");
                    graph.setEdgeAttribute(id, "size", 1);
                    graph.setEdgeAttribute(id, "zIndex", 0);
                }
            });

            sigma.refresh();
        }

        // Node selection and highlighting
        function selectNode(nodeId) {
            // Reset previous selection
            resetHighlight();

            selectedNode = nodeId;
            highlightedNodes.add(nodeId);

            // Find connected nodes
            graph.forEachEdge(nodeId, (edgeId, attrs, source, target) => {
                highlightedEdges.add(edgeId);
                highlightedNodes.add(source);
                highlightedNodes.add(target);
            });

            // Update node colors
            graph.forEachNode((id, attrs) => {
                if (highlightedNodes.has(id)) {
                    graph.setNodeAttribute(id, "color", attrs.originalColor);

                    graph.setEdgeAttribute(id, "size", 3);

                <span class="data-tab-dot" style="background: ${config.color}"></span>
                <span>${type}</span>
                <span class="data-tab-count">${nodes.length}</span>
            `;
            tab.addEventListener("click", () => switchTab(type));
            dataPanelTabs.appendChild(tab);
            if (!firstTab) firstTab = type;
        });

        // Build table for a type
        function buildTable(type) {
            const nodes = nodesByType[type] || [];
            if (nodes.length === 0) return "<p style='padding: 20px; color: #94a3b8;'>No nodes of this type</p>";

            // Collect all property keys
            const allKeys = new Set(['name']);
            nodes.forEach(node => {
                if (node.properties) {
                    Object.keys(node.properties).forEach(key => {
                        if (!hiddenProps.has(key)) allKeys.add(key);
                    });
                }
            });

            // Prioritize certain columns
            const priorityKeys = ['name', 'email', 'url', 'identifier', 'githubUsername', 'orcidIdentifier', 'role', 'githubRepositoryHandle'];
            const sortedKeys = [...allKeys].sort((a, b) => {
                const aIdx = priorityKeys.indexOf(a);
                const bIdx = priorityKeys.indexOf(b);
                if (aIdx >= 0 && bIdx >= 0) return aIdx - bIdx;
                if (aIdx >= 0) return -1;
                if (bIdx >= 0) return 1;
                return a.localeCompare(b);
            }).slice(0, 8); // Limit columns

            let html = '<div class="data-table-wrapper"><table class="data-table"><thead><tr>';
            sortedKeys.forEach(key => {
                html += `<th>${key}</th>`;
            });
            html += '</tr></thead><tbody>';

            nodes.forEach(node => {
                html += `<tr data-node-id="${node.id}">`;
                sortedKeys.forEach(key => {
                    let value = node.properties ? node.properties[key] : "";
                    if (key === "name") value = node.label;
                    if (Array.isArray(value)) value = value.join(", ");
                    if (typeof value === "object") value = JSON.stringify(value);
                    if (typeof value === "string" && value.length > 50) value = value.slice(0, 50) + "...";
                    html += `<td title="${String(value || '').replace(/"/g, '&quot;')}">${value || "-"}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            return html;
        }

        // Switch active tab
        function switchTab(type) {
            document.querySelectorAll(".data-tab").forEach(tab => {
                tab.classList.toggle("active", tab.dataset.type === type);
            });
            dataPanelContent.innerHTML = buildTable(type);

            // Add click handlers to table rows
            document.querySelectorAll(".data-table tr[data-node-id]").forEach(row => {
                row.addEventListener("click", () => {
                    const nodeId = row.dataset.nodeId;
                    selectNode(nodeId);
                    focusNode(nodeId);
                    highlightTableRow(nodeId);
                });
            });
        }

        // Highlight table row for selected node
        function highlightTableRow(nodeId) {
            document.querySelectorAll(".data-table tr.selected").forEach(row => {
                row.classList.remove("selected");
            });
            const row = document.querySelector(`.data-table tr[data-node-id="${nodeId}"]`);
            if (row) {
                row.classList.add("selected");
                row.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        }

        // Clear table selection
        function clearTableSelection() {
            document.querySelectorAll(".data-table tr.selected").forEach(row => {
                row.classList.remove("selected");
            });
        }

        // Initialize first tab
        if (firstTab) switchTab(firstTab);
    </script>
</body>
</html>
