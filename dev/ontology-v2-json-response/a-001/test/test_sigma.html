<!DOCTYPE html>
<html>
<head>
    <title>Sigma.js Test</title>
    <script src="https://unpkg.com/graphology@0.25.4/dist/graphology.umd.min.js"></script>
    <script src="https://unpkg.com/sigma@2.4.0/build/sigma.min.js"></script>
    <style>
        #container {
            width: 100%;
            height: 600px;
            background: #f0f0f0;
            border: 2px solid #333;
        }
        body { font-family: sans-serif; padding: 20px; }
        #status { padding: 10px; margin-bottom: 10px; background: #eee; }
    </style>
</head>
<body>
    <h1>Sigma.js Test Page</h1>
    <div id="status">Loading...</div>
    <div id="container"></div>

    <script>
        const statusEl = document.getElementById('status');

        try {
            // Check libraries
            if (typeof graphology === 'undefined') {
                throw new Error('graphology not loaded');
            }
            statusEl.innerHTML += '<br>✓ graphology loaded';

            if (typeof Sigma === 'undefined') {
                throw new Error('Sigma not loaded');
            }
            statusEl.innerHTML += '<br>✓ Sigma loaded';

            // Create graph
            const graph = new graphology.Graph();

            // Add some test nodes
            graph.addNode("n1", { x: 0, y: 0, size: 20, color: "#3b82f6", label: "Person 1" });
            graph.addNode("n2", { x: 1, y: 1, size: 20, color: "#22c55e", label: "Repository" });
            graph.addNode("n3", { x: 0, y: 1, size: 20, color: "#f97316", label: "Organization" });
            graph.addNode("n4", { x: 1, y: 0, size: 15, color: "#a855f7", label: "Membership" });

            // Add edges
            graph.addEdge("n1", "n2", { size: 3, color: "#999" });
            graph.addEdge("n1", "n3", { size: 3, color: "#999" });
            graph.addEdge("n1", "n4", { size: 3, color: "#999" });
            graph.addEdge("n3", "n2", { size: 3, color: "#999" });

            statusEl.innerHTML += '<br>✓ Graph created with ' + graph.order + ' nodes and ' + graph.size + ' edges';

            // Create Sigma instance
            const container = document.getElementById('container');
            const sigma = new Sigma(graph, container, {
                labelRenderedSizeThreshold: 5,
            });

            statusEl.innerHTML += '<br>✓ Sigma instance created';
            statusEl.style.background = '#d4edda';
            statusEl.innerHTML += '<br><strong>SUCCESS! You should see the graph below.</strong>';

        } catch (error) {
            statusEl.style.background = '#f8d7da';
            statusEl.innerHTML += '<br>❌ Error: ' + error.message;
            console.error(error);
        }
    </script>
</body>
</html>
