# Dev container stack. Compose publishes ports on the host (more reliable than
# devcontainer forwardPorts in some setups). Interpolation vars (SSH_PORT, etc.)
# can be set in `.devcontainer/.env` (see `.devcontainer/.env.example`).
#
# Internal SSH: devcontainers `sshd` feature listens on 2222, not 22 — map host:2222.
#
# Explicit DNS: containers on external networks (e.g. `dev`) sometimes get no working resolver
# and `uv pip` fails with "dns error" / "failed to lookup address information".
# Override in `.devcontainer/.env`: DEVCONTAINER_DNS_1 / DEVCONTAINER_DNS_2.
services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    dns:
      - "${DEVCONTAINER_DNS_1:-1.1.1.1}"
      - "${DEVCONTAINER_DNS_2:-8.8.8.8}"
    env_file:
      - ../.env
    environment:
      # Avoid ~/.cache/uv (often root-owned after sshd/common-utils); workspace is bind-mounted as vscode.
      UV_CACHE_DIR: /workspaces/project/.uv-cache
      SELENIUM_REMOTE_URL: ${SELENIUM_REMOTE_URL:-http://gme-selenium-firefox:4444}
      # GIMIE runs as the gme-gimie-api sidecar (the `gimie` Python dep was
      # removed). Required for repository extraction — unset → in-process gimie,
      # which is no longer installed (RuntimeError). Mirror this in prod.
      GIMIE_API_URL: ${GIMIE_API_URL:-http://gme-gimie-api:15400}
    ports:
      - "${SSH_PORT:-2222}:2222"
      - "${APP_PORT:-1234}:1234"
      - "${DEV_PORT:-8888}:8888"
    volumes:
      - ..:/workspaces/project:cached
    command: sleep infinity
    networks:
      - dev
  gme-qdrant:
    image: qdrant/qdrant:latest
    container_name: gme-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../data/qdrant/storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - dev
  # README "Option B": multi-session standalone Firefox (ORCID, Selenium-backed tools).
  gme-selenium-firefox:
    image: selenium/standalone-firefox
    container_name: gme-selenium-firefox
    ports:
      - "${SELENIUM_GRID_PORT:-4444}:4444"
      - "${SELENIUM_VNC_PORT:-7900}:7900"
    shm_size: "2g"
    environment:
      SE_NODE_MAX_SESSIONS: "5"
      SE_NODE_SESSION_TIMEOUT: "300"
    restart: unless-stopped
    networks:
      - dev
  # gimie-api sidecar: runs gimie out-of-process so the app calls it over HTTP
  # (the `gimie` Python dependency was removed — see OPERATIONS_RUNBOOK §8). The
  # app reaches it via GIMIE_API_URL (set on the devcontainer above). REQUIRED
  # for repository extraction; mirror this service in the production deploy.
  #
  # Image pinned by digest for reproducibility (== :latest resolved 2026-06-07,
  # gimie 0.7.2). Re-resolve + re-validate with scripts/v2/gimie_api_parity.py
  # when bumping. To follow the moving tag instead, set GIMIE_API_IMAGE=:latest.
  gme-gimie-api:
    image: ${GIMIE_API_IMAGE:-ghcr.io/sdsc-ordes/gimie-api@sha256:7a8a59b70d0787e1d265ff08f24328dd2d518f25dcc504b0420f8648ce99ecdb}
    container_name: gme-gimie-api
    environment:
      # gimie-api reads the GitHub token from ACCESS_TOKEN.
      ACCESS_TOKEN: ${GME_GITHUB_TOKEN:-}
    ports:
      - "${GIMIE_API_PORT:-7000}:15400"
    restart: unless-stopped
    networks:
      - dev

networks:
  dev:
    external: true
