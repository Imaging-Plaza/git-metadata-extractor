[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-metadata-extractor"
version = "3.0.0"
description = "This project is designed to classify imaging software repositories and extract relevant information using AI models."
readme = "README.md"
# The pinned generator requires Pydantic >=2.12 on Python 3.14+, while this
# project pins 2.11.7. Keep the declared development toolchain resolvable.
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Quentin Chappuis", email = "quentin.chappuis@epfl.ch" },
    { name = "Robin Franken", email = "robin.franken@epfl.ch" },
    { name = "Carlos Vivar Rios", email = "carlos.vivarrios@epfl.ch" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Index retrieval is an HTTP service; no sources/storage library is installed.
    "fastapi>=0.122.0",
    "uvicorn[standard]==0.34.3",
    "pydantic==2.11.7",
    "jsonschema[format-nongpl]>=4.26.0,<5",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "openai==2.1.0",
    "tiktoken==0.9.0",
    "google-genai>=1.31.0",
    "repo-to-text>=0.7.0",
    "PyLD==2.0.4",
    "rdflib==6.3.2",
    "rdflib-jsonld==0.6.2",
    "PyYAML==6.0.2",
    "selenium>=4.36.0",
    "beautifulsoup4==4.13.4",
    "aiohttp>=3.14.0",
    "uvicorn-worker==0.3.0",
    "pydantic-ai>=1.0.15",
    "griffe<2",
    # logfire (transitive: pydantic-ai -> logfire) imports the deprecated
    # `opentelemetry._events` module, which opentelemetry-api DROPPED in
    # 1.44.0 — while logfire 4.39.0 (latest) still declares
    # `opentelemetry-sdk<1.45.0`, so its own range does not exclude the
    # break. A fresh resolve therefore installs 1.44.0 and every test that
    # touches pydantic-ai dies at import with
    # `ModuleNotFoundError: No module named 'opentelemetry._events'`.
    # Drop these caps once logfire stops importing the removed module.
    "opentelemetry-api<1.44",
    "opentelemetry-sdk<1.44",
    "httpx",
    "markdownify==1.2.0",
    "pyshacl==0.28.1",
    "click>=8.1.0",
    "tenacity>=8",
]

[project.urls]
Homepage = "https://imaging-plaza.epfl.ch"
Repository = "https://github.com/Imaging-Plaza/git-metadata-extractor"
Issues = "https://github.com/Imaging-Plaza/git-metadata-extractor/issues"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-testmon>=2.1.3",
    "pytest-xdist>=3.6.1",
    "tomli>=2; python_version < '3.11'",
    "black>=23.0.0",
    "mypy>=1.0.0",
    # Pinned exactly, both of them: `just v2-models-check` regenerates the
    # models and compares byte-for-byte against the committed output, so the
    # generator AND the formatter it shells out to are part of that contract.
    # With ranges, any upstream release that reorders imports or retouches
    # formatting turns the gate red on an unrelated PR (this is exactly how
    # codegen 0.71.0 + ruff 0.16.0 broke it — the committed files predated
    # both). Bump these deliberately, then run `just v2-models-generate`.
    "ruff==0.16.0",
    "datamodel-code-generator==0.71.0",
    "respx>=0.21",
    "requests-mock>=1.12",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mike>=2.1.3",
    "pymdown-extensions>=10.14.0"
]

[tool.setuptools.packages.find]
include = ["git_metadata_extractor*"]

[tool.setuptools.package-data]
# Ship the open-pulse ontology TTL (and any other in-package data) inside
# the wheel — the SHACL gate loads it at runtime from git_metadata_extractor/validation/.
# The Docker image also gets it via the package COPY; this covers pip installs.
"*" = ["*.ttl"]
"git_metadata_extractor.mapping" = ["config/*/*.yaml", "config/README.txt"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "ARG", "PTH", "TD", "FIX", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
ignore = ["S101","T201", "G004", "E501", "FA100"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["git_metadata_extractor.models.DataModel", "git_metadata_extractor.models.InternalModel"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]
"tests/*.py" = ["E402"]
# Generated from the SHACL shapes by scripts/v2/generate_from_ontology.py.
# These three are inherent to generated code rather than fixable in it:
#   N815 — field names mirror ontology property names (pulse_githubUsername),
#          which is the point; renaming them would break the alias mapping.
#   COM812 — trailing-comma rule that conflicts with `ruff format`, which the
#          generator runs over its own output.
#   TC003 — `datetime`/`Decimal` are needed at runtime by Pydantic, so they
#          cannot move into a TYPE_CHECKING block.
#   TC001 — same reason, for the generated enumeration `Literal` aliases.
#          Pydantic resolves annotations at runtime to build its validators, so
#          a name imported only under TYPE_CHECKING raises NameError on model
#          construction. The enumerations are load-bearing, not just hints.
"git_metadata_extractor/schema/generated/*.py" = ["N815", "COM812", "TC001", "TC003"]

[tool.pytest.ini_options]
markers = [
    "v2: tests for the v2 extraction pipeline and schema validation track",
    "live_provider: opt-in tests that hit live external provider APIs",
    "llm_integration: opt-in tests that call real LLM providers",
    "openalex: legacy marker for OpenAlex-scoped tests (index code lives in open-pulse-sources now)",
]

[tool.datamodel-codegen]
input_file_type = "jsonschema"
output_model_type = "pydantic_v2.BaseModel"
target_python_version = "3.10"
use_title_as_name = true
field_constraints = true
disable_timestamp = true
formatters = ["ruff-format", "ruff-check"]
