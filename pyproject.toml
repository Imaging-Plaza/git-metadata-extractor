[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-metadata-extractor"
version = "2.0.0"
description = "This project is designed to classify imaging software repositories and extract relevant information using AI models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Quentin Chappuis", email = "quentin.chappuis@epfl.ch" },
    { name = "Robin Franken", email = "robin.franken@epfl.ch" },
    { name = "Carlos Vivar Rios", email = "carlos.vivarrios@epfl.ch" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi==0.115.13",
    "uvicorn[standard]==0.34.3",
    "gimie==0.7.2",
    "pydantic==2.11.7",
    "python-dotenv==0.21.1",
    "requests==2.32.4",
    "openai==1.91.0",
    "tiktoken==0.9.0",
    "google-genai==0.1.0",
    "repo-to-text==0.7.0",
    "PyLD==2.0.4",
    "rdflib==6.2.0",
    "rdflib-jsonld==0.6.2",
    "PyYAML==6.0.2",
    "selenium==4.34.2",
    "beautifulsoup4==4.13.4",
    "aiohttp==3.12.15",
    "uvicorn-worker==0.3.0"
]

[project.urls]
Homepage = "https://imaging-plaza.epfl.ch"
Repository = "https://github.com/Imaging-Plaza/git-metadata-extractor"
Issues = "https://github.com/Imaging-Plaza/git-metadata-extractor/issues"

[project.scripts]
# This assumes your CLI entry point is a function named 'main' in src/main.py
llm-finder = "src.main:main"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "ARG", "PTH", "TD", "FIX", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"src/test/*.py" = ["E402"]
